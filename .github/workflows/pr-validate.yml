name: Validate

on:
  pull_request:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  opentofu:
    name: OpenTofu (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.11.2"

      - name: tofu fmt -check (changed files only)
        run: |
          set -e
          # Only the .tf files this PR touches - not a repo-wide sweep, so
          # pre-existing formatting elsewhere doesn't fail an unrelated PR.
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" HEAD -- '*.tf')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .tf files changed - skipping"
          else
            printf '%s\n' "${files[@]}"
            tofu fmt -check -diff "${files[@]}"
          fi

      - name: tofu init + validate (each root)
        run: |
          set -e
          # Each directory containing a providers.tf is its own OpenTofu root -
          # discovered rather than hardcoded so a new root doesn't silently skip validation.
          for root in $(find infrastructure -name providers.tf -exec dirname {} \; | sort -u); do
            echo "::group::$root"
            (cd "$root" && tofu init -backend=false -input=false -no-color)
            (cd "$root" && tofu validate -no-color)
            echo "::endgroup::"
          done

  kubernetes-manifests:
    name: Kubernetes manifest lint (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: "0.8.0"
          KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
        run: |
          set -e
          curl -sSLO "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar xz -f kubeconform-linux-amd64.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform

      - name: kubeconform
        run: |
          set -e
          # Same scope as Renovate's kubernetes manager (see renovate.json's
          # \.ya?ml$ patterns - both .yaml and .yml), minus bare Helm values
          # files (*values.yaml|yml) - those have no apiVersion/kind, they're
          # inputs to a chart rather than standalone manifests.
          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find services infrastructure/kubernetes \( -iname "*.yaml" -o -iname "*.yml" \) ! -iname "*values.yaml" ! -iname "*values.yml" -print0)

          kubeconform -strict -summary -output pretty \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            "${files[@]}"

  kube-linter:
    name: Kubernetes manifest lint (kube-linter)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install kube-linter
        env:
          KUBE_LINTER_VERSION: "0.8.3"
          KUBE_LINTER_SHA256: "1a6d8419b11971372971fdbc22682b684ebfb7cf1c39591662d1b6ca736c41df"
        run: |
          set -e
          curl -sSLO "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz"
          echo "${KUBE_LINTER_SHA256}  kube-linter-linux.tar.gz" | sha256sum -c -
          tar xz -f kube-linter-linux.tar.gz kube-linter
          sudo install kube-linter /usr/local/bin/kube-linter

      - name: kube-linter
        id: lint
        run: |
          set -e
          # If the ruleset itself changed, a diff-scoped run wouldn't catch
          # pre-existing violations of a newly-enabled check elsewhere in the
          # fleet - so that needs every manifest, not just what this PR
          # touches. Otherwise, only the manifests this PR touches, same as
          # tofu fmt above, so pre-existing findings elsewhere don't fail an
          # unrelated PR.
          config_changed=$(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" HEAD -- .kube-linter.yaml)
          if [ -n "$config_changed" ]; then
            echo ".kube-linter.yaml changed - checking the full manifest tree"
            files=()
            while IFS= read -r -d '' f; do
              files+=("$f")
            done < <(find services infrastructure/kubernetes \( -iname "*.yaml" -o -iname "*.yml" \) ! -iname "*values.yaml" ! -iname "*values.yml" -print0)
          else
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" HEAD -- \
              'services/*.yaml' 'services/*.yml' 'infrastructure/kubernetes/*.yaml' 'infrastructure/kubernetes/*.yml' \
              ':(exclude)*values.yaml' ':(exclude)*values.yml')
          fi

          echo "files_changed=$([ "${#files[@]}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Kubernetes manifests changed - skipping"
            exit 0
          fi

          printf '%s\n' "${files[@]}"
          set +e
          output=$(kube-linter lint --config .kube-linter.yaml --format plain "${files[@]}" 2>&1)
          exit_code=$?
          set -e

          echo "$output"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          {
            echo "report<<KUBE_LINTER_EOF"
            echo "$output"
            echo "KUBE_LINTER_EOF"
          } >> "$GITHUB_OUTPUT"

          exit "$exit_code"

      # Only posts on failure - the check's own pass/fail status is already
      # visible in the merge panel. delete clears a stale failure comment
      # from an earlier run once the PR is fixed.
      - name: Comment findings on PR
        if: always() && steps.lint.outputs.files_changed == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: kube-linter
          delete: ${{ steps.lint.outputs.exit_code == '0' }}
          message: |
            ### kube-linter ❌ failed

            Checked against the Kubernetes manifests changed in this PR.
            Required check - `.kube-linter.yaml` currently enables checks
            one at a time as the fleet is brought into compliance with each
            (see [#115](../../issues/115)); it can't yet fail on anything
            that isn't listed there.

            <details><summary>kube-linter output</summary>

            ```
            ${{ steps.lint.outputs.report }}
            ```

            </details>
