name: Validate

on:
  pull_request:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  opentofu:
    name: OpenTofu (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "v1.12.6"

      - name: tofu fmt -check (changed files only)
        run: |
          set -e
          # Only the .tf files this PR touches - not a repo-wide sweep, so
          # pre-existing formatting elsewhere doesn't fail an unrelated PR.
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" HEAD -- '*.tf')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .tf files changed - skipping"
          else
            printf '%s\n' "${files[@]}"
            tofu fmt -check -diff "${files[@]}"
          fi

      - name: tofu init + validate (each root)
        run: |
          set -e
          # Each directory containing a providers.tf is its own OpenTofu root -
          # discovered rather than hardcoded so a new root doesn't silently skip validation.
          for root in $(find infrastructure -name providers.tf -exec dirname {} \; | sort -u); do
            echo "::group::$root"
            (cd "$root" && tofu init -backend=false -input=false -no-color)
            (cd "$root" && tofu validate -no-color)
            echo "::endgroup::"
          done

  kubernetes-manifests:
    name: Kubernetes manifest lint (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: "0.8.0"
          KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
        run: |
          set -e
          curl -sSLO "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar xz -f kubeconform-linux-amd64.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform

      - name: kubeconform
        run: |
          set -e
          # Same scope as Renovate's kubernetes manager (see renovate.json's
          # \.ya?ml$ patterns - both .yaml and .yml), minus bare Helm values
          # files (*values.yaml|yml) - those have no apiVersion/kind, they're
          # inputs to a chart rather than standalone manifests.
          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find services infrastructure/kubernetes \( -iname "*.yaml" -o -iname "*.yml" \) ! -iname "*values.yaml" ! -iname "*values.yml" -print0)

          kubeconform -strict -summary -output pretty \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            "${files[@]}"

  flux-manifest-drift:
    name: Flux system manifest drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether the manifest changed
        id: check
        run: |
          set -e
          file=clusters/eye-of-michael/flux-system/gotk-components.yaml
          echo "file=$file" >> "$GITHUB_OUTPUT"
          changed=$(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" HEAD -- "$file")
          if [ -z "$changed" ]; then
            echo "$file unchanged - skipping"
          fi
          echo "changed=${changed:+true}" >> "$GITHUB_OUTPUT"

      - name: Install flux CLI
        if: steps.check.outputs.changed == 'true'
        env:
          FLUX_VERSION: "2.9.5"
          # The installed CLI's own version doesn't need to match the target
          # version below - `flux install --version` fetches that version's
          # manifests from GitHub regardless. Pinning + checksumming this one
          # lets Renovate bump it like any other tool (see kubeconform above)
          # without trusting an unpinned install script in CI.
          FLUX_SHA256: "b853df82adfd7736f580692f9f734473d571606307139f8fd20c2a80dd1ff473"
        run: |
          set -e
          curl -sSLO "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz"
          echo "${FLUX_SHA256}  flux_${FLUX_VERSION}_linux_amd64.tar.gz" | sha256sum -c -
          tar xz -f "flux_${FLUX_VERSION}_linux_amd64.tar.gz" flux
          sudo install flux /usr/local/bin/flux

      - name: Check for drift
        if: steps.check.outputs.changed == 'true'
        run: |
          set -e
          # Renovate's flux manager bumps the "# Flux Version" comment in this
          # file by regenerating it via `flux install` - but that step needs
          # the flux CLI, which isn't available on the hosted Renovate app
          # (see PR #223's "Artifact update problem" comment). When it fails,
          # Renovate still commits the comment bump alone, leaving the header
          # claiming a version the file's actual images never received. This
          # regenerates the manifest from its own header and diffs it against
          # what's committed, so that mismatch fails CI instead of merging
          # unnoticed.
          file="${{ steps.check.outputs.file }}"
          version=$(grep -oP '^# Flux Version: \Kv[0-9.]+' "$file")
          components=$(grep -oP '^# Components: \K.*' "$file")
          echo "Checking $file against flux $version ($components)"

          flux install --version "$version" --components="$components" --export > /tmp/gotk-regenerated.yaml

          if ! diff -u "$file" /tmp/gotk-regenerated.yaml; then
            fix_cmd="flux install --version $version --components=$components --export > $file"
            echo "::error file=$file::Committed manifest doesn't match its own header (version header bumped without the controller images actually changing - likely Renovate's flux manager failing to run flux install, see #223). Fix: $fix_cmd"
            exit 1
          fi

  kube-linter:
    name: Kubernetes manifest lint (kube-linter)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: sigstore/cosign-installer@v3

      - name: Install kube-linter
        env:
          KUBE_LINTER_VERSION: "0.8.3"
          # kube-linter signs releases with this static key (published at
          # https://github.com/stackrox/kube-linter/blob/main/kubelinter-cosign.pub),
          # not a per-release checksum - it doesn't change across versions,
          # so unlike a checksum a Renovate version bump can't invalidate it.
          KUBE_LINTER_COSIGN_PUBKEY: |
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEl0HCkCRzYv0qH5QiazoXeXe2qwFX
            DmAszeH26g1s3OSsG/focPWkN88wEKQ5eiE95v+Z2snUQPl/mjPdvqpyjA==
            -----END PUBLIC KEY-----
        run: |
          set -e
          curl -sSLO "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-linux"
          curl -sSLO "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-linux.sigstore.json"
          echo "${KUBE_LINTER_COSIGN_PUBKEY}" > kubelinter-cosign.pub
          cosign verify-blob --key kubelinter-cosign.pub --bundle kube-linter-linux.sigstore.json kube-linter-linux
          sudo install kube-linter-linux /usr/local/bin/kube-linter

      - name: kube-linter
        run: |
          set -e
          # If the ruleset itself changed, a diff-scoped run wouldn't catch
          # pre-existing violations of a newly-enabled check elsewhere in the
          # fleet - so that needs every manifest, not just what this PR
          # touches. Otherwise, only the manifests this PR touches, same as
          # tofu fmt above, so pre-existing findings elsewhere don't fail an
          # unrelated PR.
          config_changed=$(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" HEAD -- .kube-linter.yaml)
          if [ -n "$config_changed" ]; then
            echo ".kube-linter.yaml changed - checking the full manifest tree"
            files=()
            while IFS= read -r -d '' f; do
              files+=("$f")
            done < <(find services infrastructure/kubernetes \( -iname "*.yaml" -o -iname "*.yml" \) ! -iname "*values.yaml" ! -iname "*values.yml" -print0)
          else
            mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" HEAD -- \
              'services/*.yaml' 'services/*.yml' 'infrastructure/kubernetes/*.yaml' 'infrastructure/kubernetes/*.yml' \
              ':(exclude)*values.yaml' ':(exclude)*values.yml')

            # Cross-object checks (e.g. dangling-service) need every manifest
            # in a changed file's directory, not just the file that changed -
            # a Service edited without touching its sibling Deployment would
            # otherwise look orphaned to a lint pass that can't see the
            # Deployment at all. Still scoped to touched directories, so
            # pre-existing findings elsewhere don't fail an unrelated PR.
            files=()
            if [ "${#changed[@]}" -gt 0 ]; then
              mapfile -t dirs < <(printf '%s\n' "${changed[@]}" | xargs -n1 dirname | sort -u)
              while IFS= read -r -d '' f; do
                files+=("$f")
              done < <(find "${dirs[@]}" -maxdepth 1 \( -iname "*.yaml" -o -iname "*.yml" \) ! -iname "*values.yaml" ! -iname "*values.yml" -print0)
            fi
          fi

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Kubernetes manifests changed - skipping"
            exit 0
          fi

          printf '%s\n' "${files[@]}"
          set +e
          output=$(kube-linter lint --config .kube-linter.yaml --format plain "${files[@]}" 2>&1)
          exit_code=$?
          set -e

          # No PR comment - the check's own pass/fail status is already
          # visible in the merge panel, and a comment on every run either
          # emails on each failure or risks re-notifying on deletion once
          # fixed. This log output is the record - see the failing check's
          # details for findings.
          echo "$output"

          exit "$exit_code"
