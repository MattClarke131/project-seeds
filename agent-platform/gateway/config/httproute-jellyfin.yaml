apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-mcp
  namespace: agents-test
spec:
  parentRefs:
    - name: mcp-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /jellyfin/mcp
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: jellyfin-mcp
