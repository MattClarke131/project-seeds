apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
  namespace: agents-test
spec:
  interval: 30m
  timeout: 10m
  releaseName: agentgateway
  dependsOn:
    - name: agentgateway-crds
  chart:
    spec:
      chart: agentgateway
      version: "v1.7.0"
      sourceRef:
        kind: HelmRepository
        name: agentgateway
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
  values:
    # Distinct GatewayClass and controllerName allow this controller to coexist
    # cleanly alongside other agentgateway installations in the same cluster.
    gatewayClassName: agentgateway-test
    controllerName: agentgateway.dev/agentgateway-test
    # Limit deployer write RBAC to this namespace instead of cluster-wide.
    rbac:
      create: true
      gatewayNamespaces:
        - agents-test
    # Istio is not installed in eye-of-michael.
    istio:
      enabled: false
    # Required for Kubernetes `restricted` Pod Security Standard.
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
