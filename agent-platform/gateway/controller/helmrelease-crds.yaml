# Installs the agentgateway.dev CRDs (AgentgatewayBackend, AgentgatewayPolicy,
# AgentgatewayParameters, AgentgatewayModel). Separated from the controller chart
# upstream so CRD lifecycle is explicit.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway-crds
  namespace: agents-test
spec:
  interval: 30m
  timeout: 5m
  releaseName: agentgateway-crds
  chart:
    spec:
      chart: agentgateway-crds
      version: "v1.7.0"
      sourceRef:
        kind: HelmRepository
        name: agentgateway
  install:
    crds: CreateReplace
    remediation:
      retries: 1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
