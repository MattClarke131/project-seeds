# Default-deny ingress. Add allow rules per client (namespace/pod) as they
# adopt the proxy. Enforcement needs a CNI with policy support; plain
# flannel (current cluster CNI) ignores NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vpn-egress
  namespace: vpn-egress
spec:
  podSelector:
    matchLabels:
      app: vpn-egress
  policyTypes:
  - Ingress
  ingress: []
