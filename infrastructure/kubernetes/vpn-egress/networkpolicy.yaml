# Restricts who may use the proxy. Enforcement needs a CNI with policy
# support; plain flannel (current cluster CNI) ignores NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vpn-egress
  namespace: vpn-egress
spec:
  podSelector:
    matchLabels:
      app: vpn-egress
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: downloads-standard
    ports:
    - port: 8888
      protocol: TCP
