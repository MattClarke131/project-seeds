apiVersion: v1
kind: PersistentVolume
metadata:
  # Placeholder, invalid on purpose: the API server rejects it until a consumer renames it.
  name: media-standard-RENAME-ME
spec:
  capacity:
    storage: 18Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.0.10.20
    path: /mnt/sleipnir/media-standard
  mountOptions:
    - nfsvers=4.1
    - hard
