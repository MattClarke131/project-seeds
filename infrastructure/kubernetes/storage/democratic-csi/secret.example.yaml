# Not applied directly - see README.md. This shows the shape of the
# `democratic-csi-truenas` Secret's `values.yaml` key, which carries the
# TrueNAS API key and the TrueNAS-side IDs (portal group, initiator group)
# that only exist once the manual TrueNAS setup in README.md is done.
# Kept out of kustomization.yaml so Flux never prunes the real Secret.
driver:
  config:
    driver: freenas-api-iscsi
    httpConnection:
      protocol: https
      host: 10.0.10.20
      port: 443
      apiKey: "<TRUENAS_API_KEY>"
      allowInsecure: false
    zfs:
      datasetParentName: sleipnir/k8s-iscsi/v
      detachedSnapshotsDatasetParentName: sleipnir/k8s-iscsi/s
      zvolCompression: lz4
      zvolDedup: "off"
      zvolEnableReservation: false
      zvolBlocksize: 16K
    iscsi:
      targetPortal: "10.0.10.20:3260"
      targetPortals: []
      interface: ""
      namePrefix: "csi-"
      nameSuffix: ""
      targetGroups:
        - targetGroupPortalGroup: <PORTAL_GROUP_ID>
          targetGroupInitiatorGroup: <INITIATOR_GROUP_ID>
          targetGroupAuthType: None
      extentInsecureTpc: true
      extentXenCompat: false
      extentDisablePhysicalBlocksize: true
      extentBlocksize: 512
      extentRpm: "SSD"
      extentAvailThreshold: 0
