# Not applied directly, and never listed in kustomization.yaml - see README.md.
# Fill in the placeholders with real values from the TrueNAS setup steps there,
# save as secret.filled-in.yaml (gitignored), then create the real Secret with:
#   kubectl apply -f secret.filled-in.yaml
apiVersion: v1
kind: Secret
metadata:
  name: democratic-csi-truenas
  namespace: democratic-csi
stringData:
  values.yaml: |
    driver:
      config:
        driver: freenas-api-iscsi
        httpConnection:
          protocol: https
          host: 10.0.10.20
          port: 443
          apiKey: "<TRUENAS_API_KEY>"
          allowInsecure: false
        zfs:
          datasetParentName: sleipnir/k8s-iscsi/v
          detachedSnapshotsDatasetParentName: sleipnir/k8s-iscsi/s
          zvolCompression: lz4
          zvolDedup: "off"
          zvolEnableReservation: false
          zvolBlocksize: 16K
        iscsi:
          targetPortal: "10.0.10.20:3260"
          targetPortals: []
          interface: ""
          namePrefix: "csi-"
          nameSuffix: ""
          targetGroups:
            - targetGroupPortalGroup: "<PORTAL_GROUP_ID>"
              targetGroupInitiatorGroup: "<INITIATOR_GROUP_ID>"
              targetGroupAuthType: None
          extentInsecureTpc: true
          extentXenCompat: false
          extentDisablePhysicalBlocksize: true
          extentBlocksize: 512
          extentRpm: "SSD"
          extentAvailThreshold: 0
