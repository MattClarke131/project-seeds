apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi
  namespace: democratic-csi
spec:
  interval: 30m
  timeout: 15m
  releaseName: democratic-csi
  chart:
    spec:
      chart: democratic-csi
      version: "0.14.6"
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
  valuesFrom:
    - kind: Secret
      name: democratic-csi-truenas
      valuesKey: values.yaml
  values:
    csiDriver:
      name: "org.democratic-csi.iscsi"

    storageClasses:
      - name: truenas-iscsi
        defaultClass: false
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: ext4
        mountOptions: []

    controller:
      externalAttacher:
        enabled: true
      externalProvisioner:
        enabled: true
      externalResizer:
        enabled: true
      externalSnapshotter:
        enabled: false
