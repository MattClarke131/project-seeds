apiVersion: v1
kind: Namespace
metadata:
  name: democratic-csi
  labels:
    # democratic-csi's node plugin needs hostNetwork/hostIPC, hostPath
    # volumes, SYS_ADMIN, and privileged - baseline/restricted PodSecurity
    # would block it (see helmrelease.yaml's node daemonset).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
