apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: database
spec:
  bootstrap:
    initdb:
      database: jfstat
      owner: app
  managed:
    roles:
      - name: sonarr-anime
        ensure: present
        login: true
        passwordSecret:
          name: postgres-sonarr-anime
  postgresql:
    pg_hba:
      # Per-app connection isolation (issue #113): pair each app's database(s)
      # with an explicit allow for its own role, then reject everyone else -
      # including the shared `app` role - from those same databases. Placed
      # ahead of CNPG's own default `host all all all scram-sha-256` catch-all,
      # so these take precedence (first match wins).
      - host sonarr-anime-main,sonarr-anime-log sonarr-anime all scram-sha-256
      - host sonarr-anime-main,sonarr-anime-log all all reject
      - host all sonarr-anime all reject
  instances: 2
  affinity:
    podAntiAffinityType: required
    topologyKey: topology.eye-of-michael/physical-host
  storage:
    size: 50Gi
    storageClass: nfs-provisioner
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "jellyfin,signal-messaging,downloads-standard,observability"
