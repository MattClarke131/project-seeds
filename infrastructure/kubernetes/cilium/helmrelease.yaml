apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  timeout: 15m
  releaseName: cilium
  chart:
    spec:
      chart: cilium
      version: "1.20.2"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
  values:
    ipam:
      mode: kubernetes

    kubeProxyReplacement: true
    # Talos's local control-plane load-balancer, not the kube-vip VIP - avoids a
    # bootstrap dependency on the CNI being up before kube-vip's ARP can work.
    k8sServiceHost: localhost
    k8sServicePort: 7445

    # Talos already mounts cgroupv2 at this path; Cilium's own automount conflicts with it.
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # Talos forbids SYS_MODULE; the chart default requests it and the containers fail to start.
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
          - SYSLOG
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    l2announcements:
      enabled: true

    operator:
      replicas: 1

    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: false
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - icmp
          - http
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
          # Prometheus's serviceMonitorSelector (kube-prometheus-stack/helmrelease.yaml)
          # requires this label, or it won't scrape the ServiceMonitor.
          additionalLabels:
            release: kube-prometheus-stack
