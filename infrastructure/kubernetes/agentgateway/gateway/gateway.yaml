# One proxy for every MCP backend; each backend gets its own path, e.g. /jellyfin/mcp.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mcp
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: mcp
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
---
# Every request needs a key from the manual `agentgateway-api-keys` Secret (see README.md); no key means 401.
# The key is stripped before forwarding, so backends never see it.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: api-keys
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mcp
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: agentgateway-api-keys
