# Flux-managed. See clusters/eye-of-michael/flux-system/agentgateway.yaml.
# The Gateway and its policies live in ../gateway, a separate Kustomization, because their CRDs come from these HelmReleases.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - networkpolicy.yaml
