# Selecting the controller pods turns on default-deny for them; only the flows below are allowed.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentgateway-controller
  namespace: agentgateway-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway
      app.kubernetes.io/instance: agentgateway
  ingress:
    # xDS: every proxy pulls its config from the controller.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/managed-by: agentgateway
      toPorts:
        - ports:
            - port: "9978"
              protocol: TCP
    # Kubelet readiness and liveness probes.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
  egress:
    # Watches Gateway API and agentgateway resources and creates the proxy Deployments.
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
