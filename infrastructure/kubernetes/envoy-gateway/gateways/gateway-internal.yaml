# LAN entry point. Apps attach HTTPS listeners through their own ListenerSet, one certificate per hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: internal
  allowedListeners:
    namespaces:
      from: All
  listeners:
    # Only https-redirect.yaml attaches here, so plain HTTP always redirects to HTTPS.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
