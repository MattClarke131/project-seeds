apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 30m
  timeout: 15m
  releaseName: envoy-gateway
  chart:
    spec:
      chart: gateway-helm
      version: "v1.10.0"
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
  # The chart bundles Gateway API and Envoy Gateway CRDs in crds/, which plain Helm never upgrades.
  install:
    crds: CreateReplace
    remediation:
      retries: 1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
  values:
    deployment:
      # Leader election keeps one active; the second takes over during node drains and upgrades.
      replicas: 2
      pod:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                control-plane: envoy-gateway
    podDisruptionBudget:
      minAvailable: 1
    # Injects zone labels for zone-aware routing; this cluster has no zones.
    topologyInjector:
      enabled: false
