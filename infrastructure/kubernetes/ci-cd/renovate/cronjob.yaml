apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: ci-cd
spec:
  schedule: "0 6 * * *"  # daily, 6 AM - tighten to weekly once PR volume/grouping feels right
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: renovate
              image: renovate/renovate:44.50.3
              env:
                - name: RENOVATE_PLATFORM
                  value: "github"
                - name: RENOVATE_REPOSITORIES
                  value: '["MattClarke131/project-seeds"]'
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-github-token
                      key: token
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false # renovate needs to write to its cache/workdir
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "1"
