apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  timeout: 15m
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.3"
      sourceRef:
        kind: HelmRepository
        name: jetstack
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
  values:
    crds:
      enabled: true
    # Issues certificates for HTTPS listeners on Gateway API ListenerSets (#444).
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      gatewayAPI:
        enabled: true
        enableListenerSet: true
      featureGates:
        ListenerSets: true
