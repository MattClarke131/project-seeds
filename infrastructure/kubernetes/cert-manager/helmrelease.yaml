apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  timeout: 15m
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: "v1.20.2"
      sourceRef:
        kind: HelmRepository
        name: jetstack
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
  values:
    crds:
      enabled: true
