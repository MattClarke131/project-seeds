# Migrated from a manually-run `helm install` (see README.md's git history
# for the old --set invocation) as part of #15 - Flux now owns this
# release. Values below are transcribed from `helm get values promtail`,
# not the README's --set flag (chart-version-dependent flag naming).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
  namespace: observability
spec:
  interval: 30m
  timeout: 15m
  releaseName: promtail
  chart:
    spec:
      chart: promtail
      version: "6.17.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
  values:
    config:
      lokiAddress: http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push
      snippets:
        pipelineStages:
          - cri: {}
          # Redact API keys and tracker passkeys before they reach Loki (e.g. autobrr logs webhook URLs on error).
          - replace:
              expression: '(?i)(?:apikey|api_key|passkey)=([^&\s"\\]+)'
              replace: "<redacted>"
          - replace:
              expression: '(?i)x-api-key\W{1,4}([A-Za-z0-9._~+/=-]{8,})'
              replace: "<redacted>"
          # Other tracker key params, and keys embedded in RSS-download and announce paths (e.g. Sonarr/autobrr grab URLs).
          - replace:
              expression: '(?i)[?&](?:torrent_pass|authkey|rsskey|api_token)=([A-Za-z0-9_-]{16,})'
              replace: "<redacted>"
          - replace:
              expression: '/rss/download/\d+/([A-Za-z0-9]{16,})'
              replace: "<redacted>"
          - replace:
              expression: '/([A-Za-z0-9]{16,})/announce'
              replace: "<redacted>"
          - replace:
              expression: '(?i)/announce/([A-Za-z0-9]{16,})'
              replace: "<redacted>"
