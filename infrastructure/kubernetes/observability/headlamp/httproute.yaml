apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: observability
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: headlamp
      sectionName: https
  hostnames:
    - headlamp.labmatt.com
  rules:
    - backendRefs:
        - name: headlamp
          port: 80
