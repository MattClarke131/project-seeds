# Flux-managed. See clusters/eye-of-michael/flux-system/observability.yaml
# for the Kustomization CR that reconciles this path, and #15 for the
# rollout plan this is the first cutover of.
#
# json-exporter's json-exporter-jellyfin-token Secret stays manual, same
# as renovate-github-token/newt-auth - see json-exporter/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - dashboards/flux-cluster.yaml
  - dashboards/jellyfin-process-health.yaml
  - dashboards/kubernetes-overview.yaml
  - dashboards/live-logs.yaml
  - dashboards/proxmox-overview.yaml
  - dashboards/truenas-overview.yaml
  - flux-monitoring/podmonitor.yaml
  - graphite-exporter/deployment.yaml
  - graphite-exporter/servicemonitor.yaml
  - kube-prometheus-stack/custom-alerts.yaml
  - kube-prometheus-stack/prometheus-targets-configmap.yaml
  - kube-prometheus-stack/helmrepository.yaml
  - kube-prometheus-stack/helmrelease.yaml
  - metrics-server/helmrepository.yaml
  - metrics-server/helmrelease.yaml
  - promtail/helmrepository.yaml
  - promtail/helmrelease.yaml
  - loki/helmrelease.yaml
  - json-exporter/helmrelease.yaml
  - ntfy-alertmanager/configmap.yaml
  - ntfy-alertmanager/deployment.yaml
  - ntfy/deployment.yaml
  - ntfy/ingress.yaml
  - services/jellyfin-servicemonitor.yaml
