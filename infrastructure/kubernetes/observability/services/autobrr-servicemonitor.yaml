apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: autobrr
  namespace: observability
  labels:
    app: autobrr
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - downloads-standard
  selector:
    matchLabels:
      app: autobrr
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 30s
