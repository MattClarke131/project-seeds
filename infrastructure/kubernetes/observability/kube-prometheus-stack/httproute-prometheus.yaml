apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: observability
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: prometheus
      sectionName: https
  hostnames:
    - prometheus.labmatt.com
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
