# Alternative to #283's combined PodMonitor: one PodMonitor per CNPG
# cluster instead of a single shared one. See this PR's body for why
# CNPG's own Cluster.spec.monitoring.enablePodMonitor field isn't used
# for this - the operator-generated PodMonitor never carries the
# "release: kube-prometheus-stack" label this Prometheus requires
# (confirmed live via `kubectl get prometheus -o jsonpath='{.spec.podMonitorSelector}'`),
# so it would silently never get scraped.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-postgres
  namespace: observability
  labels:
    app: cnpg-postgres
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - database
  selector:
    matchLabels:
      cnpg.io/cluster: postgres
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      # path defaults to /metrics, interval to Prometheus's own
      # scrapeInterval (already 30s here) - no need to restate either.
      relabelings:
        # This file only ever selects the "postgres" cluster, so
        # cnpg_cluster is a constant here rather than derived from the
        # pod's cnpg.io/cluster label - contrast with #283's combined
        # PodMonitor, which covers both clusters and needs the derived
        # version. cnpg.io/instanceRole still varies per pod (primary vs.
        # replica), so that one still has to come from the pod label -
        # and isn't a valid Prometheus label name as-is (dot/slash).
        - targetLabel: cnpg_cluster
          replacement: postgres
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_instanceRole]
          targetLabel: cnpg_instance_role
