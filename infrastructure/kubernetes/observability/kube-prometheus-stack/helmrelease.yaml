# Migrated from a manually-run `helm upgrade` (see git history for the old
# values.yaml) as part of #15 - Flux now owns this release. Values below are
# unchanged from that file; only the wrapper is new.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  timeout: 15m
  releaseName: kube-prometheus-stack
  chart:
    spec:
      chart: kube-prometheus-stack
      # Reverted from 88.5.4 (2026-08-25): that upgrade's HelmRelease timed
      # out and failed to remediate cleanly while the cluster hit unrelated
      # node instability mid-rollout, and was suspended + manually rolled
      # back to stop further retries. Back to the last known-good version
      # until the broader rollout-safety issue this surfaced (see follow-up
      # ticket) is understood and fixed.
      version: "88.6.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
  values:
    prometheus:
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
          cert-manager.io/cluster-issuer: letsencrypt-cloudflare
        hosts:
          - prometheus.labmatt.com
        tls:
          - hosts:
              - prometheus.labmatt.com
            secretName: prometheus-tls
      prometheusSpec:
        # Mount targets from ConfigMap
        configMaps:
          - prometheus-targets
        additionalScrapeConfigs:
          # Generated from Terraform outputs.tf
          - job_name: 'node-exporter'
            file_sd_configs:
              - files:
                  - /etc/prometheus/configmaps/prometheus-targets/prometheus-targets.json
            relabel_configs:
              - source_labels: [__address__]
                target_label: instance
              - source_labels: [hostname]
                target_label: hostname
              - source_labels: [host]
                target_label: host
              - source_labels: [role]
                target_label: role
          # Reuses the same target file as node-exporter (control_plane-role
          # entries only), rewritten to etcd's metrics port. Talos binds
          # etcd's --listen-metrics-urls to 127.0.0.1 by default - see
          # docs/adr/003-control-plane-metrics-exposure.md, which this
          # extends to etcd's own listen-metrics-urls (0.0.0.0:2381).
          # Unauthenticated by design, same accepted tradeoff as that ADR.
          - job_name: 'etcd'
            file_sd_configs:
              - files:
                  - /etc/prometheus/configmaps/prometheus-targets/prometheus-targets.json
            relabel_configs:
              - source_labels: [role]
                regex: control_plane
                action: keep
              - source_labels: [__address__]
                regex: '([^:]+):.*'
                target_label: __address__
                replacement: '${1}:2381'
              - source_labels: [__address__]
                target_label: instance
              - source_labels: [hostname]
                target_label: hostname
              - source_labels: [host]
                target_label: host
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-provisioner
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi

        retention: 30d

        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi

    grafana:
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
          cert-manager.io/cluster-issuer: letsencrypt-cloudflare
        hosts:
          - grafana.labmatt.com
        tls:
          - hosts:
              - grafana.labmatt.com
            secretName: grafana-tls

      persistence:
        enabled: true
        storageClassName: nfs-provisioner
        size: 10Gi

      # Dashboards/users/alerting live in the shared CNPG cluster, not
      # local SQLite - see #35.
      #
      # Requires postgres-secret in this namespace (reflected from
      # database/postgres-app - see docs/bootstrap/database.md).
      env:
        GF_DATABASE_TYPE: postgres
        GF_DATABASE_HOST: postgres-rw.database.svc.cluster.local:5432
        GF_DATABASE_NAME: grafana
      envValueFrom:
        GF_DATABASE_USER:
          secretKeyRef:
            name: postgres-secret
            key: username
        GF_DATABASE_PASSWORD:
          secretKeyRef:
            name: postgres-secret
            key: password

      # Safe now that state isn't a local single-writer SQLite file - see #35.
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0

      sidecar:
        dashboards:
          folderAnnotation: grafana_folder
          provider:
            # foldersFromFilesStructure to create folders in Grafana
            foldersFromFilesStructure: true

      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki-gateway.observability.svc.cluster.local
          isDefault: false
          editable: true

    defaultRules:
      disabled:
        # Measures raw host MemAvailable, which on this cluster tracks VM RAM
        # *allocation* (KVM reserves each VM's configured size regardless of
        # actual guest usage), not real memory pressure - livio reads ~94% here
        # while actually using ~21%. Replaced by a corrected version in
        # custom-alerts.yaml using the same "workload RAM %" formula the
        # proxmox-overview dashboard uses.
        NodeMemoryHighUtilization: true

    alertmanager:
      alertmanagerSpec:
        # Mounts ntfy-alertmanager-bridge-webhook-auth (created out-of-band via
        # `kubectl create secret`, not in git) at
        # /etc/alertmanager/secrets/ntfy-alertmanager-bridge-webhook-auth/{username,password}
        secrets:
          - ntfy-alertmanager-bridge-webhook-auth
      config:
        global:
          resolve_timeout: 5m
        inhibit_rules:
          - equal: [namespace, alertname]
            source_matchers: [severity = critical]
            target_matchers: [severity =~ warning|info]
          - equal: [namespace, alertname]
            source_matchers: [severity = warning]
            target_matchers: [severity = info]
          - equal: [namespace]
            source_matchers: [alertname = InfoInhibitor]
            target_matchers: [severity = info]
          - target_matchers: [alertname = InfoInhibitor]
        receivers:
          - name: "null"
          - name: ntfy-bridge
            webhook_configs:
              - url: http://ntfy-alertmanager.observability.svc.cluster.local:8080
                send_resolved: true
                http_config:
                  basic_auth:
                    username: alertmanager
                    password_file: /etc/alertmanager/secrets/ntfy-alertmanager-bridge-webhook-auth/password
        route:
          group_by: [namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: "null"
          routes:
            - matchers: [alertname = "Watchdog"]
              receiver: "null"
            - matchers: [severity =~ "critical|warning"]
              receiver: ntfy-bridge
        templates:
          - /etc/alertmanager/config/*.tmpl

    nodeExporter:
      enabled: true

    kubeStateMetrics:
      enabled: true

    # Flux no longer exposes a Ready/Reconciling/Failed metric itself. See
    # the flux-cluster dashboard's own description for the panels that got
    # dropped for lack of it. kube-state-metrics is the replacement: it
    # reads status.conditions off the CRDs directly.
    #
    # This adds gotk_resource_info readiness metrics on top of
    # kube-state-metrics' normal kube_pod_*/kube_deployment_* output. It
    # doesn't replace that output.
    #
    # Scoped to the kinds already tracked on the flux-cluster dashboard:
    # Kustomization/HelmRelease reconcilers, and
    # GitRepository/HelmRepository/Bucket/OCIRepository sources. This is
    # deliberately a subset of the full config in
    # fluxcd/flux2-monitoring-example.
    #
    # Also deliberately skips that example's --custom-resource-state-only
    # flag. It would silence the kube_pod_*/kube_deployment_* metrics that
    # the existing kubernetes-overview and proxmox-overview dashboards
    # depend on.
    kube-state-metrics:
      rbac:
        extraRules:
          - apiGroups:
              - source.toolkit.fluxcd.io
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - helmrepositories
              - buckets
              - ocirepositories
              - kustomizations
              - helmreleases
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Kustomization resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
                      source_name: [spec, sourceRef, name]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRelease resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, history, "0", chartVersion]
                      chart_name: [status, history, "0", chartName]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux GitRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: Bucket
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Bucket resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      bucket_name: [spec, bucketName]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: OCIRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux OCIRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
