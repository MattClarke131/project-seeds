apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: grafana
      sectionName: https
  hostnames:
    - grafana.labmatt.com
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
