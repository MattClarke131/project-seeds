apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-node-alerts
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: custom-node-workload
      rules:
        - alert: NodeWorkloadMemoryHighUtilization
          # Replaces NodeMemoryHighUtilization, which measures raw MemAvailable
          # (VM allocation, not real usage) - this sums actual guest RAM used.
          expr: |
            100 * sum by (host) (
              node_memory_MemTotal_bytes{job="node-exporter", role!="host"}
              - node_memory_MemAvailable_bytes{job="node-exporter", role!="host"}
            ) / on (host) sum by (host) (
              node_memory_MemTotal_bytes{job="node-exporter", role="host"}
            ) > 90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Host is running out of memory (real usage, not allocation)."
            description: >-
              Actual workload RAM usage on {{ $labels.host }} has been above
              90% of host capacity for 15 minutes, is currently at
              {{ printf "%.2f" $value }}%.

    - name: custom-jellyfin-process
      rules:
        # Jellyfin is hard-pinned to a single node (the only one with the
        # iGPU) with no fallback. Metrics come from its own EnableMetrics endpoint.
        - alert: JellyfinHighMemoryUsage
          # Container limit is 4Gi. An OOMKill here takes down the only
          # jellyfin instance outright.
          expr: system_runtime_dotnet_process_memory_working_set{job="jellyfin"} > 3.5 * 1024 * 1024 * 1024
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Jellyfin process memory is approaching its container limit."
            description: >-
              Jellyfin's working set has been above 3.5Gi (of a 4Gi limit)
              for 10 minutes, is currently at
              {{ humanize1024 $value }}B. An OOMKill here
              takes down the only jellyfin instance - it has no fallback node.
        - alert: JellyfinThreadPoolQueueBacklog
          # Work queuing faster than it drains - an early, pre-crash signal,
          # usually visible as slow/stalled streams before anything else notices.
          expr: system_runtime_threadpool_queue_length{job="jellyfin"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Jellyfin's .NET thread pool has a sustained work backlog."
            description: >-
              Jellyfin's thread pool queue length has been above 0 for 5
              minutes (currently {{ $value }}) - the process is falling
              behind on incoming work.
        - alert: JellyfinExceptionRateSpike
          # Compares to its own trailing 1h average rather than a fixed
          # threshold - some baseline exception noise is normal.
          expr: |
            rate(system_runtime_exception_count_total{job="jellyfin"}[5m]) > 0.05
            and
            rate(system_runtime_exception_count_total{job="jellyfin"}[5m])
              > 3 * avg_over_time(rate(system_runtime_exception_count_total{job="jellyfin"}[5m])[1h:5m])
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Jellyfin's internal exception rate has spiked."
            description: >-
              Jellyfin is throwing exceptions at {{ printf "%.2f" $value }}/s,
              more than 3x its trailing 1-hour average, for 5 minutes.

    - name: custom-container-memory
      rules:
        # Cluster-wide OOM detection - default rules only catch this via
        # crash-looping (several restarts); this fires on a single OOM+restart.
        - alert: ContainerOOMKilled
          expr: |
            (
              kube_pod_container_status_restarts_total
              - (kube_pod_container_status_restarts_total offset 15m) >= 1
            )
            # ignoring(reason) is a no-op here (restarts_total has no reason
            # label) but is required for the `and` join to match at all.
            and ignoring(reason) (
              max_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[15m]) == 1
            )
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "A container was OOMKilled."
            description: >-
              {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }})
              was restarted after being OOMKilled in the last 15 minutes.
              Check whether its memory limit needs raising.
        # Early warning ahead of ContainerOOMKilled - catches a container
        # climbing toward its limit before it's actually killed.
        - alert: ContainerMemoryNearLimit
          # Scaled to % in the expr, not the description - Prometheus's
          # templates have no "mul" func; see EtcdHighFsyncDuration below.
          expr: |
            100 * sum by (namespace, pod, container) (container_memory_working_set_bytes{container!="", container!="POD"})
            / on (namespace, pod, container) group_left
            sum by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
            > 85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "A container's memory usage is approaching its limit."
            description: >-
              {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }})
              has used more than 85% of its memory limit for 15 minutes,
              currently {{ printf "%.1f" $value }}%. Risks an OOMKill if it
              keeps climbing.

    - name: custom-flux-health
      rules:
        # gotk_resource_info (customResourceState, see helmrelease.yaml)
        # covers every Flux object's Ready condition - a failure here won't
        # crash any pod, so nothing else alerts on it (#56).
        - alert: FluxReconciliationFailing
          expr: gotk_resource_info{ready="False"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Flux {{ $labels.customresource_kind }}/{{ $labels.name }} in {{ $labels.exported_namespace }} isn't Ready."
            description: >-
              {{ $labels.customresource_kind }}/{{ $labels.name }} in
              {{ $labels.exported_namespace }} has failed to reconcile for
              at least 15 minutes. Check `flux logs` or `kubectl describe`
              for that object - the previously-applied version is still
              live, so nothing else will have alerted on this.

    - name: custom-truenas-metrics
      rules:
        # graphite-exporter has no scrape-target failure of its own to alert
        # on (Prometheus sees it as `up` even when sleipnir's netdata has
        # stopped pushing) - this is what actually caught issue #101, where
        # the metric sat at a stale value for days with nothing noticing.
        - alert: TrueNASMetricsStale
          expr: time() - graphite_last_processed_timestamp_seconds{job="graphite-exporter"} > 1800
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "sleipnir's TrueNAS metrics haven't updated in over 30 minutes."
            description: >-
              graphite-exporter last processed a sample from sleipnir's
              netdata {{ printf "%.0f" $value }}s ago. Check netdata's
              exporting engine on sleipnir (`journalctl -u netdata`,
              /etc/netdata/exporting.conf) and that graphite-exporter's pod
              is reachable at its LoadBalancer IP (`kubectl get svc -n
              observability graphite-exporter`).

    - name: custom-ingress-nginx
      rules:
        # Grouped by ingress rather than one shared ratio across every
        # backend. Baseline 5xx rates vary a lot per service (health
        # checks, expected 404s), and a shared baseline would let a noisy
        # backend mask a spike in a clean one.
        #
        # Excludes ingress="" - requests that matched no Ingress object.
        # That bucket has no real backend behind it, so it isn't
        # actionable, and shouldn't share a baseline with real services.
        #
        # Fires only when three conditions hold together: the 5xx rate
        # clears a 5% floor, exceeds 3x that ingress's own trailing 1h
        # average, and the window has at least 20 requests. The volume
        # check matters because a handful of requests can push the ratio
        # to 100% on a single failure, clearing both other thresholds.
        - alert: IngressNginx5xxRateSpike
          expr: |
            (
              sum by (ingress) (rate(nginx_ingress_controller_requests{job="ingress-nginx", ingress!="", status=~"5.."}[5m]))
              /
              sum by (ingress) (rate(nginx_ingress_controller_requests{job="ingress-nginx", ingress!=""}[5m]))
            ) > 0.05
            and
            sum by (ingress) (increase(nginx_ingress_controller_requests{job="ingress-nginx", ingress!=""}[5m])) > 20
            and
            (
              sum by (ingress) (rate(nginx_ingress_controller_requests{job="ingress-nginx", ingress!="", status=~"5.."}[5m]))
              /
              sum by (ingress) (rate(nginx_ingress_controller_requests{job="ingress-nginx", ingress!=""}[5m]))
            ) > 3 * avg_over_time(
              (
                sum by (ingress) (rate(nginx_ingress_controller_requests{job="ingress-nginx", ingress!="", status=~"5.."}[5m]))
                /
                sum by (ingress) (rate(nginx_ingress_controller_requests{job="ingress-nginx", ingress!=""}[5m]))
              )[1h:5m]
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "An ingress's 5xx rate has spiked above its own baseline."
            description: >-
              {{ $labels.ingress }}'s 5xx rate has stayed above 5% and 3x
              its trailing 1-hour baseline for 10 minutes, on at least 20
              requests in 5 minutes. Check the dashboard's status-code
              breakdown for this ingress.

    - name: custom-etcd-latency
      rules:
        # Scraped via the etcd job in ADR 003's etcd addendum - see
        # etcd-overview dashboard. Thresholds are etcd's own healthy-cluster guidance.
        #
        # Scaled to ms in the expr, not the description - a `mul $value 1000`
        # there previously failed admission (no "mul" func) and Flux reconciliation.
        - alert: EtcdHighFsyncDuration
          expr: 1000 * histogram_quantile(0.99, sum by (le, hostname) (rate(etcd_disk_wal_fsync_duration_seconds_bucket{job="etcd"}[5m]))) > 10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "etcd WAL fsync latency is above etcd's healthy-cluster guidance."
            description: >-
              {{ $labels.hostname }}'s etcd WAL fsync p99 has been above
              10ms for 10 minutes, is currently
              {{ printf "%.1f" $value }}ms. This is etcd's own
              write path, not host CPU/memory - a sustained miss here means
              the disk backing etcd can't keep up, which is what drives the
              request-timeout/NodeNotReady cascade tracked in issue #125.
        - alert: EtcdHighBackendCommitDuration
          expr: 1000 * histogram_quantile(0.99, sum by (le, hostname) (rate(etcd_disk_backend_commit_duration_seconds_bucket{job="etcd"}[5m]))) > 25
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "etcd backend commit latency is above etcd's healthy-cluster guidance."
            description: >-
              {{ $labels.hostname }}'s etcd backend commit p99 has been
              above 25ms for 10 minutes, is currently
              {{ printf "%.1f" $value }}ms. Same underlying
              concern as EtcdHighFsyncDuration - see that alert's
              description.

    - name: custom-zfs-health
      rules:
        # Textfile-collector script writes this per Proxmox host - see
        # infrastructure/proxmox/scripts/zpool_health_textfile.sh and
        # docs/bootstrap/host-monitoring.md.
        - alert: ZpoolNotOnline
          # warning: a non-ONLINE pool can mean an active drive failure
          # needing physical replacement, not just a benign, self-correcting
          # event - see #125/#231.
          expr: zpool_health_ok == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "A ZFS pool on {{ $labels.host }} has left the ONLINE state."
            description: >-
              Pool {{ $labels.pool }} on {{ $labels.host }} has reported a
              non-ONLINE state for 5 minutes. Run
              `zpool status {{ $labels.pool }}` on that host for the
              vdev-level cause.
        # Mirrors TrueNASMetricsStale (custom-truenas-metrics) - the timer
        # itself failing would otherwise look identical to a healthy pool.
        - alert: ZpoolHealthMetricsStale
          expr: time() - zpool_health_textfile_timestamp_seconds > 1800
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.host }}'s zpool health textfile hasn't updated in over 30 minutes."
            description: >-
              The zpool-health systemd timer on {{ $labels.host }} hasn't
              refreshed its textfile-collector output in over 30 minutes.
              Check `systemctl status zpool-health.timer` on that host.

    - name: custom-sata-link
      rules:
        # Written per Proxmox host by infrastructure/proxmox/scripts/sata_link_textfile.sh (#143).
        - alert: SataLinkReset
          expr: increase(sata_link_resets_total[1h]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "SATA link {{ $labels.port }} on {{ $labels.host }} hard-reset in the last hour."
            description: >-
              The kernel on {{ $labels.host }} reset SATA link
              {{ $labels.port }}. Run `journalctl -k | grep {{ $labels.port }}`
              on that host for the error lines. On nicholas ata1 this means
              the max_performance power-saving fix from #143 did not hold.
        - alert: SataLinkMetricsStale
          expr: time() - sata_link_textfile_timestamp_seconds > 1800
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.host }}'s SATA link textfile hasn't updated in over 30 minutes."
            description: >-
              The sata-link systemd timer on {{ $labels.host }} hasn't
              refreshed its textfile-collector output in over 30 minutes.
              Check `systemctl status sata-link.timer` on that host.

    - name: custom-cnpg-postgres
      rules:
        # Scraped via the cnpg-postgres PodMonitor (issue #162), which covers
        # both the "postgres" and "immich-db" Clusters. Both run instances: 2,
        # so a healthy primary always shows exactly one connected streaming
        # replica - a fixed threshold, since "any replica down" is bad
        # regardless of workload.
        - alert: CNPGReplicaDown
          expr: cnpg_pg_replication_streaming_replicas{cnpg_instance_role="primary"} < 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "A CNPG cluster's primary has no connected replica."
            description: >-
              {{ $labels.cnpg_cluster }}'s primary has had no streaming
              replica connected for 5 minutes. The cluster is running on a
              single instance with no failover target.
        # Covers both failure modes: the pod/exporter is unreachable at all
        # (Prometheus's own `up`), and the pod is up but postgres itself
        # isn't (cnpg_collector_up, CNPG's own liveness signal).
        - alert: CNPGInstanceDown
          expr: up{job="observability/cnpg-postgres"} == 0 or cnpg_collector_up == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "A CNPG instance is down or unreachable."
            description: >-
              {{ $labels.cnpg_cluster }} instance {{ $labels.pod }} has
              been down or unreachable for 5 minutes. Check
              `kubectl get cluster -n {{ $labels.namespace }} {{ $labels.cnpg_cluster }}`.
        # Seconds have real physical meaning here regardless of workload -
        # any sustained lag risks stale reads off -ro/-r and a stale
        # failover target.
        - alert: CNPGReplicationLagHigh
          expr: cnpg_pg_replication_lag > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "A CNPG replica is falling behind its primary."
            description: >-
              {{ $labels.cnpg_cluster }} instance {{ $labels.pod }} has been
              more than 30s behind its primary for 5 minutes, is currently
              {{ printf "%.1f" $value }}s.
        # "Normal" connection count is workload-dependent (arr apps vs.
        # immich vs. jellystat), so this alerts on percentage of each
        # cluster's own max_connections rather than a fixed count.
        - alert: CNPGConnectionPoolNearExhaustion
          expr: |
            100 * sum by (cnpg_cluster) (cnpg_backends_total)
            / on (cnpg_cluster) group_left()
            max by (cnpg_cluster) (cnpg_pg_settings_setting{name="max_connections"})
            > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "A CNPG cluster is approaching max_connections."
            description: >-
              {{ $labels.cnpg_cluster }} has used more than 80% of its
              max_connections for 10 minutes, currently
              {{ printf "%.1f" $value }}%. New connections (e.g. a deploy
              or backfill) may start failing.

    - name: custom-downloads-standard
      rules:
        # Critical so it pages: VPN drops are a known recurring failure here.
        # A missing series also fires, covering gluetun's control server or the qbittorrent-vpn pod being down.
        - alert: DownloadsVPNDown
          expr: (count(gluetun_vpn_info{status="running"}) or vector(0)) == 0
          for: 5m
          labels:
            severity: critical
            # gluetun_vpn_info carries json-exporter's namespace; group with the stack it describes.
            namespace: downloads-standard
          annotations:
            summary: "downloads-standard VPN tunnel is down; torrenting has stopped."
            description: >-
              gluetun in the qbittorrent-vpn pod has not reported a running
              VPN for 5 minutes. Check `kubectl logs -n downloads-standard
              deploy/qbittorrent-vpn -c gluetun`. This also fires if
              json-exporter cannot reach gluetun's control server on port 8000.
        # Info severity: never sent to ntfy, and InfoInhibitor suppresses it in Alertmanager.
        # Visible as firing in Grafana's alert rule list; the Downloads dashboard is the main view.
        # Grouped without `message` so the timer survives changes to e.g. Prowlarr's failed-indexer list.
        # max_over_time bridges failed scrapes: exportarr v2 fails the whole scrape on one API timeout.
        # Bazarr uses object/issue labels; object is mapped onto source to match the *arr apps.
        - alert: ArrHealthCheckFailing
          expr: |
            max by (namespace, container, source) (
              max_over_time({__name__=~"(radarr|sonarr|prowlarr)_system_health_issues", source!="UpdateCheck"}[15m])
              or
              label_replace(max_over_time(bazarr_system_health_issues[15m]), "source", "$1", "object", "(.+)")
            ) > 0
          for: 1h
          labels:
            severity: info
          annotations:
            summary: "{{ $labels.container }} reports a failing health check."
            description: >-
              {{ $labels.container }} health check {{ $labels.source }} has
              failed for 1 hour. The Failing health checks table on the
              Downloads dashboard shows the message.
        # Only import-side states count; slow or stalled downloads are on the qBittorrent tiles.
        # max_over_time keeps one failed scrape from restarting the 24h timer.
        - alert: ArrQueueStuck
          expr: |
            sum by (namespace, container) (
              max by (namespace, container, download_state, download_status, status) (
                max_over_time({__name__=~"(radarr|sonarr)_queue_total",
                 download_state=~"importPending|importBlocked|failedPending",
                 download_status=~"warning|error"}[15m])
              )
            ) > 0
          for: 24h
          labels:
            severity: info
          annotations:
            summary: "{{ $labels.container }} has imports stuck for a day."
            description: >-
              {{ $labels.container }} has had {{ $value }} downloaded items
              failing to import for 24 hours. They will not import on their
              own; see Activity > Queue in the app.
