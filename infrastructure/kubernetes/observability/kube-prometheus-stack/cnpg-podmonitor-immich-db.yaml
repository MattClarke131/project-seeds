# See cnpg-podmonitor-postgres.yaml - split per-cluster instead of one
# shared PodMonitor, for comparison against #283.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-immich-db
  namespace: observability
  labels:
    app: cnpg-immich-db
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - immich
  selector:
    matchLabels:
      cnpg.io/cluster: immich-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      # See cnpg-podmonitor-postgres.yaml for why path/interval are
      # omitted and cnpg_cluster is a constant here.
      relabelings:
        - targetLabel: cnpg_cluster
          replacement: immich-db
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_instanceRole]
          targetLabel: cnpg_instance_role
