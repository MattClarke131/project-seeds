prometheus:
  prometheusSpec:
    # Mount targets from ConfigMap
    configMaps:
      - prometheus-targets
    additionalScrapeConfigs:
      # Generated from Terraform outputs.tf
      - job_name: 'node-exporter'
        file_sd_configs:
          - files:
              - /etc/prometheus/configmaps/prometheus-targets/prometheus-targets.json
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
          - source_labels: [hostname]
            target_label: hostname
          - source_labels: [host]
            target_label: host
          - source_labels: [role]
            target_label: role
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-provisioner
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    retention: 30d

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

grafana:
  ingress:
    enabled: true
    ingressClassName: nginx

  persistence:
    enabled: true
    storageClassName: nfs-provisioner
    size: 10Gi

  sidecar:
    dashboards:
      folderAnnotation: grafana_folder

  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.observability.svc.cluster.local
      isDefault: false
      editable: true


nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

