prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    hosts:
      - prometheus.labmatt.com
    tls:
      - hosts:
          - prometheus.labmatt.com
        secretName: prometheus-tls
  prometheusSpec:
    # Mount targets from ConfigMap
    configMaps:
      - prometheus-targets
    additionalScrapeConfigs:
      # Generated from Terraform outputs.tf
      - job_name: 'node-exporter'
        file_sd_configs:
          - files:
              - /etc/prometheus/configmaps/prometheus-targets/prometheus-targets.json
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
          - source_labels: [hostname]
            target_label: hostname
          - source_labels: [host]
            target_label: host
          - source_labels: [role]
            target_label: role
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-provisioner
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    retention: 30d

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

grafana:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    hosts:
      - grafana.labmatt.com
    tls:
      - hosts:
          - grafana.labmatt.com
        secretName: grafana-tls

  persistence:
    enabled: true
    storageClassName: nfs-provisioner
    size: 10Gi

  # nfs-provisioner doesn't enforce ReadWriteOnce exclusivity, so a
  # RollingUpdate can briefly double-mount this PVC across old and new pods.
  # Grafana stores its own state in SQLite, which doesn't tolerate two
  # concurrent writers - same failure mode that hit Bazarr, see
  # docs/future-improvements.md.
  deploymentStrategy:
    type: Recreate

  sidecar:
    dashboards:
      folderAnnotation: grafana_folder

  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.observability.svc.cluster.local
      isDefault: false
      editable: true


alertmanager:
  alertmanagerSpec:
    # Mounts ntfy-alertmanager-bridge-webhook-auth (created out-of-band via
    # `kubectl create secret`, not in git) at
    # /etc/alertmanager/secrets/ntfy-alertmanager-bridge-webhook-auth/{username,password}
    secrets:
      - ntfy-alertmanager-bridge-webhook-auth
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - equal: [namespace, alertname]
        source_matchers: [severity = critical]
        target_matchers: [severity =~ warning|info]
      - equal: [namespace, alertname]
        source_matchers: [severity = warning]
        target_matchers: [severity = info]
      - equal: [namespace]
        source_matchers: [alertname = InfoInhibitor]
        target_matchers: [severity = info]
      - target_matchers: [alertname = InfoInhibitor]
    receivers:
      - name: "null"
      - name: ntfy-bridge
        webhook_configs:
          - url: http://ntfy-alertmanager.observability.svc.cluster.local:8080
            send_resolved: true
            http_config:
              basic_auth:
                username: alertmanager
                password_file: /etc/alertmanager/secrets/ntfy-alertmanager-bridge-webhook-auth/password
    route:
      group_by: [namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "null"
      routes:
        - matchers: [alertname = "Watchdog"]
          receiver: "null"
        - matchers: [severity =~ "critical|warning"]
          receiver: ntfy-bridge
    templates:
      - /etc/alertmanager/config/*.tmpl

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
