prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    hosts:
      - prometheus.labmatt.com
    tls:
      - hosts:
          - prometheus.labmatt.com
        secretName: prometheus-tls
  prometheusSpec:
    # Mount targets from ConfigMap
    configMaps:
      - prometheus-targets
    additionalScrapeConfigs:
      # Generated from Terraform outputs.tf
      - job_name: 'node-exporter'
        file_sd_configs:
          - files:
              - /etc/prometheus/configmaps/prometheus-targets/prometheus-targets.json
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
          - source_labels: [hostname]
            target_label: hostname
          - source_labels: [host]
            target_label: host
          - source_labels: [role]
            target_label: role
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-provisioner
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    retention: 30d

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

grafana:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    hosts:
      - grafana.labmatt.com
    tls:
      - hosts:
          - grafana.labmatt.com
        secretName: grafana-tls

  persistence:
    enabled: true
    storageClassName: nfs-provisioner
    size: 10Gi

  # nfs-provisioner doesn't enforce ReadWriteOnce exclusivity, so a
  # RollingUpdate can briefly double-mount this PVC across old and new pods.
  # Grafana stores its own state in SQLite, which doesn't tolerate two
  # concurrent writers - same failure mode that hit Bazarr, see
  # docs/future-improvements.md.
  deploymentStrategy:
    type: Recreate

  sidecar:
    dashboards:
      folderAnnotation: grafana_folder

  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.observability.svc.cluster.local
      isDefault: false
      editable: true


nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

