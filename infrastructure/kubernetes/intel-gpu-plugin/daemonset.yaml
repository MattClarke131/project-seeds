# Registers /dev/dri with kubelet's Device Plugin API (gpu.intel.com/i915) so pods can
# request the GPU as a real resource instead of a raw hostPath mount - kubelet then grants
# the consuming pod's cgroup actual access to the device, which a hostPath mount alone
# never does. Required for Jellyfin's hardware transcoding to work at all. Scoped to
# k8s-livio-w1 only (the one node with the GPU passed through) and deployed to
# kube-system, matching kube-flannel/kube-proxy (exempt from PodSecurity admission, so
# the hostPath mounts below are allowed). No RBAC needed - registration is a local
# socket call, not a Kubernetes API call.
#
# Adapted from upstream's base manifest (v0.36.0): pinned the release image (base
# defaults to `:devel`), added namespace + nodeSelector, dropped `seLinuxOptions.type`
# (SELinux runs permissive here, so it's a no-op, and the type isn't guaranteed to exist
# in Talos's policy).
# https://github.com/intel/intel-device-plugins-for-kubernetes/blob/v0.36.0/deployments/gpu_plugin/base/intel-gpu-plugin.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-plugin
  namespace: kube-system
  labels:
    app: intel-gpu-plugin
spec:
  selector:
    matchLabels:
      app: intel-gpu-plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: intel-gpu-plugin
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-livio-w1
      containers:
        - name: intel-gpu-plugin
          image: intel/intel-gpu-plugin:0.36.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: "45Mi"
              cpu: 40m
            limits:
              memory: "90Mi"
              cpu: 100m
          volumeMounts:
            - name: devfs
              mountPath: /dev/dri
              readOnly: true
            - name: sysfsdrm
              mountPath: /sys/class/drm
              readOnly: true
            - name: kubeletsockets
              mountPath: /var/lib/kubelet/device-plugins
            - name: cdipath
              mountPath: /var/run/cdi
      volumes:
        - name: devfs
          hostPath:
            path: /dev/dri
        - name: sysfsdrm
          hostPath:
            path: /sys/class/drm
        - name: kubeletsockets
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: cdipath
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
