apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 30m
  timeout: 15m
  releaseName: ingress-nginx
  chart:
    spec:
      chart: ingress-nginx
      version: "4.15.1"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
  values:
    controller:
      # Run on control plane nodes using talos host network
      hostNetwork: true

      # Only run on control plane nodes
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""

      # Tolerate control plane taints so pods can schedule there
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      # Ensures one runs on each control plane node
      kind: DaemonSet

      resources:
        requests:
          cpu: 100m
          memory: 128Mi
