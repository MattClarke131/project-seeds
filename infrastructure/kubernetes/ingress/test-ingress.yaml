---
apiVersion: v1
kind: Namespace
metadata:
  name: test-ingress
  labels:
    # Lets this namespace's routes attach to the public Gateway, and lets envoy-public reach its pods.
    labmatt.com/public-gateway: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: test-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
      - name: hello-world
        image: gcr.io/google-samples/hello-app:2.0
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 10m
            memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
  namespace: test-ingress
spec:
  selector:
    app: hello-world
  ports:
    - port: 80
      targetPort: 8080
