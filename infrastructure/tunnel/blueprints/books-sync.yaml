# Kobo device sync only (see services/downloads-standard/calibre-web-
# automated/README.md and issue #17). No SSO: a Kobo can't complete an
# SSO redirect or hold a session cookie. httproute-books-sync.yaml routes
# only /kobo/ on this host, and auth is the per-user token in the sync
# URL, checked by CWA. Pangolin has no rate-limit setting, so the limit
# lives in that file's BackendTrafficPolicy.
public-resources:
  books-sync:
    name: "Books Sync"
    mode: http
    full-domain: books-sync.labmatt.com
    targets:
      - site: faithful-brachyurophis-fasciolatus
        method: http
        hostname: envoy-public.envoy-gateway-system.svc.cluster.local
        port: 80
    auth:
      sso-enabled: false
