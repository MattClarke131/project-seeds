# Kobo device sync only (see services/downloads-standard/calibre-web-
# automated/README.md and issue #17). No SSO: a Kobo can't complete an
# SSO redirect or hold a session cookie, and the k8s ingress
# (ingress-books-sync.yaml) already restricts this host to the /kobo/
# path prefix, so there's nothing else behind it worth gating - auth is
# the per-user token embedded in the sync URL itself, checked by CWA.
#
# Rate limiting on /kobo/ (the one thing not covered by SSO on other
# resources) isn't a Pangolin dashboard feature at all - checked the docs,
# there's no rate-limit rule action, resource setting, or Blueprint field
# for it. Traefik (which Pangolin runs on) does have a native RateLimit
# middleware, but that's substrate config on the VPS (out of scope per
# issue #7), not something reachable from here. If wanted, do it instead
# via nginx.ingress.kubernetes.io/limit-rps on ingress-books-sync.yaml -
# enforced at the same ingress that does the /kobo/-only path restriction,
# fully git-tracked.
public-resources:
  books-sync:
    name: "Books Sync"
    mode: http
    full-domain: books-sync.labmatt.com
    targets:
      - site: faithful-brachyurophis-fasciolatus
        method: http
        hostname: ingress-nginx-controller.ingress-nginx.svc.cluster.local
        port: 80
    auth:
      sso-enabled: false
