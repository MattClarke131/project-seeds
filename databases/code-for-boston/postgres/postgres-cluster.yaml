# Dedicated CNPG cluster for internet-facing apps shared with the Code for
# Boston volunteer group (e.g. Leantime) — kept separate from
# infrastructure/kubernetes/database's cluster so a compromise of a
# public-facing app can't reach internal-only apps' data.
#
# Each tenant app should get its own Database + role rather than reusing
# the bootstrap "app" role below, so one tenant can't read another's data.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: code-for-boston
spec:
  instances: 1
  storage:
    size: 10Gi
    storageClass: nfs-provisioner
  postgresql:
    pg_hba:
      # One line per tenant, pinning its role to only its own database,
      # e.g.:
      #   - hostssl leantime leantime_user all scram-sha-256
      #
      # CNPG always appends its own "host all all all scram-sha-256"
      # catch-all after whatever's listed here, and that can't be
      # removed - so without the reject line below, a tenant whose role
      # doesn't match any line above would just fall through to CNPG's
      # catch-all and be let in anyway. This reject line is what
      # actually enforces "only the tenants listed above get in" -
      # being a custom rule, it's evaluated before CNPG's catch-all ever
      # comes into play.
      - host all all all reject
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: ""
