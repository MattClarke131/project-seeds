# Hand-authored, unlike gotk-components.yaml/gotk-sync.yaml (see README.md).
# Two Kustomizations: the Gateway resources can't be applied until the controller's HelmRelease installs their CRDs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./infrastructure/kubernetes/envoy-gateway/controller
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-gateways
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-gateway
  interval: 10m0s
  path: ./infrastructure/kubernetes/envoy-gateway/gateways
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
