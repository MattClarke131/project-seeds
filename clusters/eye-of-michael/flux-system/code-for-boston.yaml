# Hand-authored, one Kustomization per top-level directory category -
# see clusters/eye-of-michael/README.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: code-for-boston
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./services/code-for-boston
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
