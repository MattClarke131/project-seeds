# Flux-managed. See clusters/eye-of-michael/flux-system/immich.yaml for the
# Kustomization CR that reconciles this path. Bundles immich-power-tools/ too
# - it deploys into this same immich namespace, same pattern as
# services/downloads-standard grouping its app subdirs into one category.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - cnpg-cluster.yaml
  - library-pvc.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - ../immich-power-tools
