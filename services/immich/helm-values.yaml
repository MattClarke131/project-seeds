immich:
  persistence:
    library:
      existingClaim: immich-library

machine-learning:
  enabled: false

valkey:
  enabled: true

server:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            tag: v3.0.1
          env:
            DB_HOSTNAME: "immich-db-rw.immich.svc.cluster.local"
            DB_PORT: "5432"
            DB_DATABASE_NAME: "immich"
            DB_USERNAME: "immich"
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-db-user
                  key: password
  ingress:
    main:
      enabled: true
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        cert-manager.io/cluster-issuer: letsencrypt-cloudflare
      hosts:
        - host: photos.labmatt.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - photos.labmatt.com
          secretName: labmatt-com-tls
