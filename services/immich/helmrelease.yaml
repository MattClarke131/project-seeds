apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  timeout: 15m
  releaseName: immich
  chart:
    spec:
      chart: immich
      version: "0.13.1"
      sourceRef:
        kind: HelmRepository
        name: immich
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
  values:
    immich:
      persistence:
        library:
          existingClaim: immich-library

    machine-learning:
      enabled: false

    valkey:
      enabled: true

    server:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                tag: v3.0.1
              env:
                DB_HOSTNAME: "immich-db-rw.immich.svc.cluster.local"
                DB_PORT: "5432"
                DB_DATABASE_NAME: "immich"
                DB_USERNAME: "immich"
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-user
                      key: password
      ingress:
        main:
          enabled: true
          className: nginx
          annotations:
            nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
            cert-manager.io/cluster-issuer: letsencrypt-cloudflare
          hosts:
            - host: photos.labmatt.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - photos.labmatt.com
              secretName: labmatt-com-tls
