apiVersion: v1
kind: Namespace
metadata:
  name: jellyfin
  labels:
    # Required for the jellyfin pod's hostPath mount of /dev/dri (Intel iGPU
    # passthrough for hardware transcoding, see values.yaml's affinity) -
    # hostPath volumes are blocked below the privileged PSA level.
    pod-security.kubernetes.io/enforce: privileged
    # Lets this namespace's routes attach to the public Gateway, and lets envoy-public reach its pods.
    labmatt.com/public-gateway: "true"
