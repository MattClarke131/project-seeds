# Flux-managed. See clusters/eye-of-michael/flux-system/jellyfin.yaml for
# the Kustomization CR that reconciles this path. Bundles jellystat/ and
# jellyfin-mcp/ too - both deploy into this same jellyfin namespace, same
# pattern as services/downloads-standard and services/immich grouping their
# app subdirs into one category.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pvc-media.yaml
  - httproute-public.yaml
  - listenerset-lan.yaml
  - httproute-lan.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - ../jellystat
  - jellyfin-mcp

components:
  - ../../infrastructure/kubernetes/storage/shared-volumes/media-standard

patches:
  - target:
      kind: PersistentVolume
      name: media-standard-RENAME-ME
    patch: |-
      - op: replace
        path: /metadata/name
        value: media-standard
