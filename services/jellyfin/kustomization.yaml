# Flux-managed. See clusters/eye-of-michael/flux-system/jellyfin.yaml for
# the Kustomization CR that reconciles this path. Bundles jellystat/ too -
# it deploys into this same jellyfin namespace, same pattern as
# services/downloads-standard and services/immich grouping their app
# subdirs into one category.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pvc-media.yaml
  - ingress-block-metrics.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - ../jellystat

components:
  - ../../infrastructure/kubernetes/storage/shared-volumes/media-standard

patches:
  - target:
      kind: PersistentVolume
      name: media-standard-RENAME-ME
    patch: |-
      - op: replace
        path: /metadata/name
        value: media-standard
