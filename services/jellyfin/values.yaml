# Jellyfin image
image:
  repository: jellyfin/jellyfin
  tag: 10.11.11
  pullPolicy: IfNotPresent

# Persistence for config/metadata
persistence:
  config:
    enabled: true
    storageClass: nfs-provisioner
    accessMode: ReadWriteOnce
    size: 100Gi

  media:
    enabled: true
    existingClaim: jellyfin-media

# Service configuration
service:
  type: ClusterIP
  port: 8096

# Ingress for access via nginx
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: jellyfin.labmatt.com
      paths:
        - path: /
          pathType: Prefix
    - host: mattflix.labmatt.com
      paths:
        - path: /
          pathType: Prefix

# Hard-pinned to k8s-livio-w1: it's the only node with the iGPU passed through
# (a PCI device can only be owned by one VM), so this is the only node that can
# do hardware transcoding. No fallback node - if w1 is down, Jellyfin is down.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-livio-w1

# GPU access for hardware transcoding (see affinity above), granted via the Intel GPU
# device plugin (infrastructure/kubernetes/intel-gpu-plugin/), which registers /dev/dri
# with kubelet as the allocatable resource requested below.
#
# LIBVA_DRIVER_NAME pinned to iHD (Intel's modern/actively-maintained VAAPI driver):
# without it, libva auto-detection in this minimal container (no pciutils/vainfo) isn't
# reliable and can silently fall back to the legacy i965 driver, which has known gaps in
# VPP filters like scale_vaapi on Gen9+ hardware.
#
# NOTE: `env` is nested under `jellyfin:` (not top-level) - that's the chart's actual
# schema (jellyfin/jellyfin-helm), confirmed by inspecting templates/deployment.yaml
# after a top-level `env:` silently rendered to nothing.
jellyfin:
  env:
    - name: LIBVA_DRIVER_NAME
      value: iHD

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 4Gi
    gpu.intel.com/i915: 1
