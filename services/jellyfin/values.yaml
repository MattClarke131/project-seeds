# Jellyfin image
image:
  repository: jellyfin/jellyfin
  tag: 10.11.6
  pullPolicy: IfNotPresent

# Persistence for config/metadata
persistence:
  config:
    enabled: true
    storageClass: nfs-provisioner
    accessMode: ReadWriteOnce
    size: 100Gi

  media:
    enabled: true
    existingClaim: jellyfin-media

# Service configuration
service:
  type: ClusterIP
  port: 8096

# Ingress for access via nginx
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: jellyfin.labmatt.com
      paths:
        - path: /
          pathType: Prefix
    - host: mattflix.labmatt.com
      paths:
        - path: /
          pathType: Prefix

# Prefer livio because it does hardware transcoding, but allow scheduling on other nodes if those are unavailable
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-livio-w1
                - k8s-livio-w2
