apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-lan
  namespace: jellyfin
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: jellyfin-lan
      sectionName: https
  hostnames:
    - jellyfin.labmatt.com
  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096
