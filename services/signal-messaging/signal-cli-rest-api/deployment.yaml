apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-cli-rest-api
  namespace: signal-messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signal-cli-rest-api
  template:
    metadata:
      labels:
        app: signal-cli-rest-api
    spec:
      containers:
        - name: signal-cli-rest-api
          image: bbernhard/signal-cli-rest-api:0.100
          ports:
            - containerPort: 8080
          env:
            - name: MODE
              value: json-rpc
          volumeMounts:
            - name: signal-cli-data
              mountPath: /home/.local/share/signal-cli
      volumes:
        - name: signal-cli-data
          persistentVolumeClaim:
            claimName: signal-cli-data
---
apiVersion: v1
kind: Service
metadata:
  name: signal-cli-rest-api
  namespace: signal-messaging
spec:
  selector:
    app: signal-cli-rest-api
  ports:
    - port: 8080
      targetPort: 8080
