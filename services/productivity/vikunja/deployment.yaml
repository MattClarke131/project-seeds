apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: vikunja
spec:
  replicas: 1
  # Required by the ReadWriteOncePod files PVC: a RollingUpdate's second pod can never mount it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vikunja
  template:
    metadata:
      labels:
        app: vikunja
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: vikunja
        image: vikunja/vikunja:2.7.1
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 3456
          name: http
        env:
        - name: VIKUNJA_SERVICE_PUBLICURL
          value: "https://vikunja.labmatt.com/"
        - name: VIKUNJA_SERVICE_TIMEZONE
          value: "America/New_York"
        # Accounts are created with the CLI instead. See README.
        - name: VIKUNJA_SERVICE_ENABLEREGISTRATION
          value: "false"
        # Signs JWTs. Without a stable value, every restart logs everyone out.
        - name: VIKUNJA_SERVICE_SECRET
          valueFrom:
            secretKeyRef:
              name: vikunja-secret
              key: service-secret
        - name: VIKUNJA_DATABASE_TYPE
          value: "postgres"
        - name: VIKUNJA_DATABASE_HOST
          value: "postgres-rw.database.svc.cluster.local"
        - name: VIKUNJA_DATABASE_DATABASE
          value: "vikunja"
        - name: VIKUNJA_DATABASE_SSLMODE
          value: "require"
        - name: VIKUNJA_DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: postgres-vikunja-reflection
              key: username
        - name: VIKUNJA_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-vikunja-reflection
              key: password
        # /health checks dependencies, so it's kept off liveness to avoid restarts on a Postgres blip.
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        volumeMounts:
        - name: files
          mountPath: /app/vikunja/files
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: files
        persistentVolumeClaim:
          claimName: vikunja-files
      - name: tmp
        emptyDir: {}
