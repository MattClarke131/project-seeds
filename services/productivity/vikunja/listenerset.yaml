# HTTPS listener on the internal Gateway; cert-manager issues vikunja-gateway-tls from the annotation.
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: vikunja
  namespace: vikunja
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  parentRef:
    name: internal
    namespace: envoy-gateway-system
  listeners:
    - name: https
      hostname: vikunja.labmatt.com
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: vikunja-gateway-tls
