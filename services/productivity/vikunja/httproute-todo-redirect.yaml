# Browser shortcut only. Vikunja serves from its single public URL, so this redirects instead of proxying.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vikunja-todo-redirect
  namespace: vikunja
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: vikunja-todo-redirect
      sectionName: https
  hostnames:
    - todo.labmatt.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: vikunja.labmatt.com
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 301
