apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vikunja
  namespace: vikunja
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: vikunja
      sectionName: https
  hostnames:
    - vikunja.labmatt.com
  rules:
    - backendRefs:
        - name: vikunja
          port: 3456
