apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr-portuguese
  namespace: downloads-standard
spec:
  ingressClassName: nginx
  rules:
  - host: radarr-portuguese.labmatt.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: radarr-portuguese
            port:
              number: 7878
