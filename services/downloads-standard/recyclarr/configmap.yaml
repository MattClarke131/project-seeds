apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: downloads-standard
data:
  recyclarr.yml: |
    radarr:
      radarr-standard:
        base_url: http://radarr-standard.downloads-standard.svc.cluster.local:7878
        api_key: !env_var RADARR_API_KEY
        delete_old_custom_formats: true

        quality_definition:
          type: movie

        quality_profiles:
          - name: HD Bluray + WEB
            reset_unmatched_scores:
              enabled: false
            # -1000 so a plain x264 release (-500) still clears the floor and
            # gets grabbed as a fallback when no x265 exists yet, instead of
            # being rejected outright and leaving the movie unfulfilled.
            min_format_score: -1000

        custom_formats:
          - trash_ids:
              - dc98083864ea246d05a42df0d05f81cc  # x265 (HD)
            assign_scores_to:
              - name: HD Bluray + WEB
                score: 500
          # Scored separately from (and lower than) "x265 (HD)" above: both
          # used to be bundled at +500, but "x265 (no HDR/DV)" also matches
          # every non-HDR x265 release that "x265 (HD)" matches, so the two
          # stacked to 1000 and made a plain SDR release outrank an existing
          # HDR10+/Dolby Vision file -- triggering an unwanted "upgrade" that
          # downgraded picture quality (Supergirl (2026), 2026-09-05). Keeping
          # this scored (rather than dropping it to 0) still lets an HDR
          # release later outscore and replace an SDR file already on disk.
          - trash_ids:
              - 839bea857ed2c0a8e084f3cbdbd65ecb  # x265 (no HDR/DV)
            assign_scores_to:
              - name: HD Bluray + WEB
                score: -100
          - trash_ids:
              - 2899d84dc9372de3408e6d8cc18e9666  # x264
            assign_scores_to:
              - name: HD Bluray + WEB
                score: -500

    sonarr:
      sonarr-standard:
        base_url: http://sonarr-standard.downloads-standard.svc.cluster.local:8989
        api_key: !env_var SONARR_API_KEY
        delete_old_custom_formats: true

        quality_definition:
          type: series

        quality_profiles:
          - name: WEB-1080p
            reset_unmatched_scores:
              enabled: false
            min_format_score: -1000

        custom_formats:
          - trash_ids:
              - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD)
              - 9b64dff695c2115facf1b6ea59c9bd07  # x265 (no HDR/DV)
            assign_scores_to:
              - name: WEB-1080p
                score: 500
          - trash_ids:
              - cddfb4e32db826151d97352b8e37c648  # x264
            assign_scores_to:
              - name: WEB-1080p
                score: -500

      sonarr-anime:
        base_url: http://sonarr-anime.downloads-standard.svc.cluster.local:8989
        api_key: !env_var SONARR_ANIME_API_KEY
        delete_old_custom_formats: true

        quality_definition:
          type: anime

        quality_profiles:
          - name: "[Anime] Remux-1080p"
            reset_unmatched_scores:
              enabled: false
            min_format_score: -1000

        custom_formats:
          - trash_ids:
              - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD)
              - 9b64dff695c2115facf1b6ea59c9bd07  # x265 (no HDR/DV)
            assign_scores_to:
              - name: "[Anime] Remux-1080p"
                score: 500
          - trash_ids:
              - cddfb4e32db826151d97352b8e37c648  # x264
            assign_scores_to:
              - name: "[Anime] Remux-1080p"
                score: -500
