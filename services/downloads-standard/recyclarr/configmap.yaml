apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: downloads-standard
data:
  recyclarr.yml: |
    radarr:
      radarr-standard:
        base_url: http://radarr-standard.downloads-standard.svc.cluster.local:7878
        api_key: !env_var RADARR_API_KEY
        delete_old_custom_formats: true

        quality_definition:
          type: movie

        # Lets custom format scores decide repacks; see the Repack CFs below.
        media_management:
          propers_and_repacks: do_not_prefer

        quality_profiles:
          - name: HD Bluray + WEB
            reset_unmatched_scores:
              enabled: false
            # -1000 so a plain x264 release (-500) still clears the floor and
            # gets grabbed as a fallback when no x265 exists yet, instead of
            # being rejected outright and leaving the movie unfulfilled.
            min_format_score: -1000

        custom_formats:
          - trash_ids:
              - dc98083864ea246d05a42df0d05f81cc  # x265 (HD)
            assign_scores_to:
              - name: HD Bluray + WEB
                score: 500
          # Scored separately from, and below, "x265 (HD)": both match SDR
          # releases, so bundling them let SDR outrank HDR (Supergirl, 2026-09-05).
          - trash_ids:
              - 839bea857ed2c0a8e084f3cbdbd65ecb  # x265 (no HDR/DV)
            assign_scores_to:
              - name: HD Bluray + WEB
                score: -100
          - trash_ids:
              - 2899d84dc9372de3408e6d8cc18e9666  # x264
            assign_scores_to:
              - name: HD Bluray + WEB
                score: -500
          # TRaSH defaults: a repack outranks its original, but never outweighs the x265/x264 gap.
          - trash_ids:
              - e7718d7a3ce595f289bfee26adc178f5  # Repack/Proper
            assign_scores_to:
              - name: HD Bluray + WEB
                score: 5
          - trash_ids:
              - ae43b294509409a6a13919dedd4764c4  # Repack2
            assign_scores_to:
              - name: HD Bluray + WEB
                score: 6
          - trash_ids:
              - 5caaaa1c08c1742aa4342d8c4cc463f2  # Repack3
            assign_scores_to:
              - name: HD Bluray + WEB
                score: 7

    sonarr:
      sonarr-standard:
        base_url: http://sonarr-standard.downloads-standard.svc.cluster.local:8989
        api_key: !env_var SONARR_API_KEY
        delete_old_custom_formats: true

        quality_definition:
          type: series
          # Guide min (15 MB/min) assumes x264 bitrates and rejects most x265 WEB encodes of short or animated episodes.
          qualities:
            - name: WEBDL-1080p
              min: 8
            - name: WEBRip-1080p
              min: 8

        # Lets custom format scores decide repacks; see the Repack CFs below.
        media_management:
          propers_and_repacks: do_not_prefer

        quality_profiles:
          - name: WEB-1080p
            reset_unmatched_scores:
              enabled: false
            min_format_score: -1000

        custom_formats:
          - trash_ids:
              - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD)
            assign_scores_to:
              - name: WEB-1080p
                score: 500
          # Same fix as radarr-standard above: scores stack, so bundling this
          # with "x265 (HD)" let SDR outrank HDR.
          - trash_ids:
              - 9b64dff695c2115facf1b6ea59c9bd07  # x265 (no HDR/DV)
            assign_scores_to:
              - name: WEB-1080p
                score: -100
          - trash_ids:
              - cddfb4e32db826151d97352b8e37c648  # x264
            assign_scores_to:
              - name: WEB-1080p
                score: -500
          # TRaSH defaults: a repack outranks its original, but never outweighs the x265/x264 gap.
          - trash_ids:
              - ec8fa7296b64e8cd390a1600981f3923  # Repack/Proper
            assign_scores_to:
              - name: WEB-1080p
                score: 5
          - trash_ids:
              - eb3d5cc0a2be0db205fb823640db6a3c  # Repack2
            assign_scores_to:
              - name: WEB-1080p
                score: 6
          - trash_ids:
              - 44e7c4de10ae50265753082e5dc76047  # Repack3
            assign_scores_to:
              - name: WEB-1080p
                score: 7

      sonarr-anime:
        base_url: http://sonarr-anime.downloads-standard.svc.cluster.local:8989
        api_key: !env_var SONARR_ANIME_API_KEY
        delete_old_custom_formats: true

        quality_definition:
          type: anime

        # Lets custom format scores decide repacks; see the Repack CFs below.
        media_management:
          propers_and_repacks: do_not_prefer

        quality_profiles:
          - name: "[Anime] Remux-1080p"
            reset_unmatched_scores:
              enabled: false
            min_format_score: -1000

        custom_formats:
          - trash_ids:
              - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD)
            assign_scores_to:
              - name: "[Anime] Remux-1080p"
                score: 500
          # Same fix as radarr-standard above: scores stack, so bundling this
          # with "x265 (HD)" let SDR outrank HDR.
          - trash_ids:
              - 9b64dff695c2115facf1b6ea59c9bd07  # x265 (no HDR/DV)
            assign_scores_to:
              - name: "[Anime] Remux-1080p"
                score: -100
          - trash_ids:
              - cddfb4e32db826151d97352b8e37c648  # x264
            assign_scores_to:
              - name: "[Anime] Remux-1080p"
                score: -500
          # TRaSH anime defaults: a repack outranks its original, but never outweighs the x265/x264 gap.
          - trash_ids:
              - ec8fa7296b64e8cd390a1600981f3923  # Repack/Proper
            assign_scores_to:
              - name: "[Anime] Remux-1080p"
                score: 1
          - trash_ids:
              - eb3d5cc0a2be0db205fb823640db6a3c  # Repack2
            assign_scores_to:
              - name: "[Anime] Remux-1080p"
                score: 2
          - trash_ids:
              - 44e7c4de10ae50265753082e5dc76047  # Repack3
            assign_scores_to:
              - name: "[Anime] Remux-1080p"
                score: 3
