apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sabnzbd-standard
  namespace: downloads-standard
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: sabnzbd-standard
      sectionName: https
  hostnames:
    - sabnzbd.labmatt.com
  rules:
    - backendRefs:
        - name: sabnzbd-standard
          port: 8080
