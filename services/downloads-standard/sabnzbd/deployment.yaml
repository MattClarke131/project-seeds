apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd-standard
  namespace: downloads-standard
spec:
  replicas: 1
  # RollingUpdate would briefly run two pods against sabnzbd-standard-config
  # at once. nfs-provisioner doesn't enforce ReadWriteOnce exclusivity, so
  # concurrent writers from two nodes can corrupt state on this PVC.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sabnzbd-standard
  template:
    metadata:
      labels:
        app: sabnzbd-standard
    spec:
      containers:
      - name: sabnzbd-standard
        image: lscr.io/linuxserver/sabnzbd:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/New_York"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "2"
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: sabnzbd-standard-config
      - name: media
        persistentVolumeClaim:
          claimName: media-standard
