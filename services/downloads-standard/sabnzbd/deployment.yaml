apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd-standard
  namespace: downloads-standard
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: "linuxserver.io s6-overlay base image runs its init as root to chown /config etc. to PUID/PGID before dropping to that user; forcing runAsNonRoot at the k8s level would skip that step entirely"
    ignore-check.kube-linter.io/no-read-only-root-fs: "same s6-overlay init writes outside the mounted volumes during startup"
spec:
  replicas: 1
  # config PVC is ReadWriteOncePod - RollingUpdate deadlocks trying to
  # schedule a second pod while the first still holds the mount (#200).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sabnzbd-standard
  template:
    metadata:
      labels:
        app: sabnzbd-standard
    spec:
      containers:
      - name: sabnzbd-standard
        image: lscr.io/linuxserver/sabnzbd:5.1.2-ls270
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/New_York"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "5Gi"
            cpu: "2"
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: sabnzbd-standard-config-iscsi
      - name: media
        persistentVolumeClaim:
          claimName: media-standard
