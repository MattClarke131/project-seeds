apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd-standard
  namespace: downloads-standard
spec:
  replicas: 1
  # config PVC is ReadWriteOncePod - RollingUpdate deadlocks trying to
  # schedule a second pod while the first still holds the mount (#200).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sabnzbd-standard
  template:
    metadata:
      labels:
        app: sabnzbd-standard
    spec:
      containers:
      - name: sabnzbd-standard
        image: lscr.io/linuxserver/sabnzbd:5.1.2-ls270
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/New_York"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "5Gi"
            cpu: "2"
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: sabnzbd-standard-config-iscsi
      - name: media
        persistentVolumeClaim:
          claimName: media-standard
