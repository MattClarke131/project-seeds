apiVersion: v1
kind: Service
metadata:
  name: autobrr
  namespace: downloads-standard
  labels:
    app: autobrr
spec:
  type: ClusterIP
  selector:
    app: autobrr
  ports:
  - port: 7474
    targetPort: 7474
    protocol: TCP
    name: http
  - port: 9074
    targetPort: 9074
    protocol: TCP
    name: metrics
