apiVersion: apps/v1
kind: Deployment
metadata:
  name: autobrr
  namespace: downloads-standard
spec:
  replicas: 1
  # Recreate keeps a single autobrr running at a time. A second pod during a
  # rollout would open a duplicate IRC connection per tracker, which trackers
  # can treat as abuse.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: autobrr
  template:
    metadata:
      labels:
        app: autobrr
    spec:
      # autobrr's image runs fine as an arbitrary non-root UID. It never
      # touches the shared media/qBittorrent PVCs.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
      - name: autobrr
        image: ghcr.io/autobrr/autobrr:v1.60.0
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 7474
          name: http
        env:
        - name: TZ
          value: "America/New_York"
        # Default config.toml binds 127.0.0.1, unreachable from the Service.
        - name: AUTOBRR__HOST
          value: "0.0.0.0"
        - name: AUTOBRR__PORT
          value: "7474"
        # Requires postgres-autobrr-reflection to exist in this namespace
        # (reflected from database/postgres-autobrr). Until it does, the pod
        # blocks in CreateContainerConfigError, then proceeds on its own.
        - name: AUTOBRR__DATABASE_TYPE
          value: "postgres"
        - name: AUTOBRR__POSTGRES_HOST
          value: "postgres-rw.database.svc.cluster.local"
        - name: AUTOBRR__POSTGRES_PORT
          value: "5432"
        - name: AUTOBRR__POSTGRES_DATABASE
          value: "autobrr"
        - name: AUTOBRR__POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-autobrr-reflection
              key: username
        - name: AUTOBRR__POSTGRES_PASS
          valueFrom:
            secretKeyRef:
              name: postgres-autobrr-reflection
              key: password
        volumeMounts:
        # Holds only the generated config.toml. All state lives in Postgres.
        - name: config
          mountPath: /config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config
        emptyDir: {}
