apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: autobrr
  namespace: downloads-standard
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: autobrr
      sectionName: https
  hostnames:
    - autobrr.labmatt.com
  rules:
    - backendRefs:
        - name: autobrr
          port: 7474
