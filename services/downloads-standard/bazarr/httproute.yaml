apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bazarr
  namespace: downloads-standard
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: bazarr
      sectionName: https
  hostnames:
    - bazarr.labmatt.com
  rules:
    - backendRefs:
        - name: bazarr
          port: 6767
