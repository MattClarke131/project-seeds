# No image.tag override: the chart's appVersion sets the image, so Renovate's chart bumps carry it (#338).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: downloads-standard
spec:
  interval: 30m
  timeout: 15m
  releaseName: seerr
  chart:
    spec:
      chart: seerr-chart
      version: "3.9.1"
      sourceRef:
        kind: HelmRepository
        name: seerr
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
  values:
    config:
      persistence:
        size: 20Gi

    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - host: gimme.labmatt.com
          paths:
            - path: /
              pathType: Prefix
