# gimme.labmatt.com on the public Gateway, reached from the internet through Pangolin.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr-public
  namespace: downloads-standard
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
  hostnames:
    - gimme.labmatt.com
  rules:
    - backendRefs:
        - name: seerr-seerr-chart
          port: 80
