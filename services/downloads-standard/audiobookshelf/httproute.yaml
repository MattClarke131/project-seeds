apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: audiobookshelf
  namespace: downloads-standard
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: audiobookshelf
      sectionName: https
  hostnames:
    - audiobooks.labmatt.com
  rules:
    - backendRefs:
        - name: audiobookshelf
          port: 80
