apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr-anime
  namespace: downloads-standard
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: sonarr-anime
      sectionName: https
  hostnames:
    - sonarr-anime.labmatt.com
  rules:
    - backendRefs:
        - name: sonarr-anime
          port: 8989
