apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent-vpn
  namespace: downloads-standard
spec:
  replicas: 1
  # RollingUpdate would briefly run two pods against qbittorrent-vpn-config
  # at once. nfs-provisioner doesn't enforce ReadWriteOnce exclusivity, so
  # concurrent writers from two nodes can corrupt state on this PVC.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent-vpn
  template:
    metadata:
      labels:
        app: qbittorrent-vpn
    spec:
      containers:
      - name: gluetun
        image: ghcr.io/qdm12/gluetun:v3.41.1
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        env:
        - name: VPN_SERVICE_PROVIDER
          value: "airvpn"
        - name: VPN_TYPE
          value: "wireguard"
        - name: SERVER_COUNTRIES
          value: "Netherlands"
        - name: WIREGUARD_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: gluetun-airvpn-wireguard
              key: WIREGUARD_PRIVATE_KEY
        - name: WIREGUARD_PRESHARED_KEY
          valueFrom:
            secretKeyRef:
              name: gluetun-airvpn-wireguard
              key: WIREGUARD_PRESHARED_KEY
        - name: WIREGUARD_ADDRESSES
          valueFrom:
            secretKeyRef:
              name: gluetun-airvpn-wireguard
              key: WIREGUARD_ADDRESSES
        - name: TZ
          value: "America/New_York"
        - name: HTTPPROXY
          value: "off"
        - name: SHADOWSOCKS
          value: "off"
        - name: IP6_TABLE_DISABLE
          value: "1"
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
        - name: FIREWALL_VPN_INPUT_PORTS
          value: "41231"
        ports:
        - containerPort: 8000
          name: gluetun-ctrl
        - containerPort: 8080
          name: qbit-webui
        - containerPort: 41231
          name: torrent-port
        volumeMounts:
        - name: dev-net-tun
          mountPath: /dev/net/tun
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"

      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:5.1.4-r2-ls444
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/New_York"
        - name: WEBUI_PORT
          value: "8080"
        - name: TORRENT_PORT
          value: "41231"
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 41231
          name: torrent-port
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

      # Re-authorizes qBittorrent's current VPN exit IP with MAM's tracker
      # whenever AirVPN reconnects on a new IP (fixes MAM tracker error
      # "Unrecognized host/PassKey" and the resulting stalled downloads).
      # Must run as a sidecar in this pod, not a standalone CronJob: it
      # needs gluetun's network namespace so the call is actually made
      # from the VPN exit IP.
      - name: mam-dynamic-seedbox
        image: curlimages/curl:8.11.1
        env:
        - name: MAM_ID
          valueFrom:
            secretKeyRef:
              name: mam-dynamic-seedbox
              key: mam_id
        command:
        - sh
        - -c
        - |
          while true; do
            resp=$(curl -sS -w '\nHTTP:%{http_code}' -b "mam_id=${MAM_ID}" https://t.myanonamouse.net/json/dynamicSeedbox.php)
            echo "$(date -u +%FT%TZ) ${resp}"
            # MAM's rate limit is once/hour on a rolling window; a small
            # margin here avoids routinely landing inside that window and
            # getting a harmless-but-wasted 429 "Last change too recent".
            sleep 4200
          done
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "32Mi"
            cpu: "50m"

      volumes:
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      - name: config
        persistentVolumeClaim:
          claimName: qbittorrent-vpn-config
      - name: media
        persistentVolumeClaim:
          claimName: media-standard
