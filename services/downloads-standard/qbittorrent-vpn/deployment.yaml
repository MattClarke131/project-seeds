apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent-vpn
  namespace: downloads-standard
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: "gluetun needs root for iptables/tun setup (already has NET_ADMIN); qbittorrent is a linuxserver.io s6-overlay image whose root-required init chowns /config to PUID/PGID before dropping privileges. mam-dynamic-seedbox already runs non-root and is unaffected by this exception."
    ignore-check.kube-linter.io/no-read-only-root-fs: "same reasons as run-as-non-root above"
spec:
  replicas: 1
  # config PVC is ReadWriteOncePod - RollingUpdate deadlocks trying to
  # schedule a second pod while the first still holds the mount (#200).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent-vpn
  template:
    metadata:
      labels:
        app: qbittorrent-vpn
    spec:
      containers:
      - name: gluetun
        image: ghcr.io/qdm12/gluetun:v3.41.3
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        env:
        - name: VPN_SERVICE_PROVIDER
          value: "airvpn"
        - name: VPN_TYPE
          value: "wireguard"
        - name: SERVER_COUNTRIES
          value: "Netherlands"
        - name: WIREGUARD_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: gluetun-airvpn-wireguard
              key: WIREGUARD_PRIVATE_KEY
        - name: WIREGUARD_PRESHARED_KEY
          valueFrom:
            secretKeyRef:
              name: gluetun-airvpn-wireguard
              key: WIREGUARD_PRESHARED_KEY
        - name: WIREGUARD_ADDRESSES
          valueFrom:
            secretKeyRef:
              name: gluetun-airvpn-wireguard
              key: WIREGUARD_ADDRESSES
        - name: TZ
          value: "America/New_York"
        - name: HTTPPROXY
          value: "off"
        - name: SHADOWSOCKS
          value: "off"
        - name: IP6_TABLE_DISABLE
          value: "1"
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
        - name: FIREWALL_VPN_INPUT_PORTS
          value: "41231"
        # Cilium gives pods a /32, so gluetun's default eth0 input rule misses the pod IP and drops the WebUI.
        # 8000 is the control server, scraped by json-exporter (see gluetun-control-auth.yaml).
        - name: FIREWALL_INPUT_PORTS
          value: "8080,8000"
        ports:
        - containerPort: 8000
          name: gluetun-ctrl
        - containerPort: 8080
          name: qbit-webui
        - containerPort: 41231
          name: torrent-port
        volumeMounts:
        - name: dev-net-tun
          mountPath: /dev/net/tun
        - name: gluetun-control-auth
          mountPath: /gluetun/auth/config.toml
          subPath: config.toml
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"

      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:5.1.4-r2-ls444
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/New_York"
        - name: WEBUI_PORT
          value: "8080"
        - name: TORRENT_PORT
          value: "41231"
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 41231
          name: torrent-port
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

      # Registers qBittorrent's VPN exit IP with MAM's tracker, which rejects unregistered IPs
      # ("Unrecognized host/PassKey"). Runs in this pod so calls leave from the VPN exit IP.
      # Call rules are in #394.
      - name: mam-dynamic-seedbox
        image: curlimages/curl:8.23.0
        securityContext:
          runAsNonRoot: true
          # Matches qbittorrent's PUID/PGID so it can write to the shared config volume.
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        env:
        - name: MAM_ID
          valueFrom:
            secretKeyRef:
              name: mam-dynamic-seedbox
              key: mam_id
        volumeMounts:
        # Persists the latest rotated mam_id across pod restarts.
        - name: config
          mountPath: /state
        command:
        - sh
        - -c
        - |
          umask 077
          dir=/state/mam-dynamic-seedbox
          mkdir -p "$dir"
          seed=$(printf %s "$MAM_ID" | sha256sum | cut -c1-16)
          # Reseed from the Secret only when it changes, so a new session replaces the saved cookie.
          if [ ! -s "$dir/mam_id" ] || [ "$(cat "$dir/seed" 2>/dev/null)" != "$seed" ]; then
            printf %s "$MAM_ID" > "$dir/mam_id"
            printf %s "$seed" > "$dir/seed"
            echo "$(date -u +%FT%TZ) seeded mam_id from Secret"
          fi
          log() { echo "$(date -u +%FT%TZ) $*"; }
          # "<epoch of last call that reached MAM> <registered IP> <epoch it was registered>"; survives restarts.
          state=$dir/state
          [ -s "$state" ] || echo "0 none 0" > "$state"
          next_try=0
          fails=0
          waiting_for=
          while true; do
            now=$(date +%s)
            read -r reached reg_ip ok_at < "$state"
            ip=$(curl -sS -m 5 http://127.0.0.1:8000/v1/publicip/ip 2>/dev/null | sed -n 's/.*"public_ip":"\([^"]*\)".*/\1/p')
            if [ -z "$ip" ] || [ "$now" -lt "$next_try" ]; then
              sleep 60; continue
            fi
            if [ "$ip" = "$reg_ip" ] && [ $((now - ok_at)) -lt 86400 ]; then
              sleep 60; continue
            fi
            # MAM asks for at most one call per hour; restarts read $state so they honor it too.
            if [ $((now - reached)) -lt 3600 ]; then
              if [ "$waiting_for" != "$ip" ]; then
                log "need to register $ip; waiting $((3600 - (now - reached)))s for hourly limit"
                waiting_for=$ip
              fi
              sleep 60; continue
            fi
            waiting_for=
            resp=$(curl -sS -m 30 -w '\nHTTP:%{http_code}' -D "$dir/headers" -b "mam_id=$(cat "$dir/mam_id")" https://t.myanonamouse.net/json/dynamicSeedbox.php 2>&1)
            code=${resp##*HTTP:}
            # MAM returns a new mam_id on every call; the old value eventually stops working.
            new=$(sed -n 's/^[Ss]et-[Cc]ookie: *mam_id=\([^;]*\).*/\1/p' "$dir/headers" 2>/dev/null | tr -d '\r' | tail -1)
            rm -f "$dir/headers"
            if [ -n "$new" ]; then
              printf %s "$new" > "$dir/mam_id.tmp" && mv "$dir/mam_id.tmp" "$dir/mam_id"
            fi
            log "$(echo "$resp" | tr '\n' ' ') cookie_rotated=$([ -n "$new" ] && echo yes || echo no)"
            if [ "$code" = 000 ]; then
              # MAM never saw this call, so it doesn't count; back off 30s doubling to 10min.
              fails=$((fails + 1))
              wait=$((30 << (fails - 1)))
              [ "$wait" -gt 600 ] && wait=600
              next_try=$((now + wait))
            else
              fails=0
              case "$resp" in
                *'"Success":true'*) echo "$now $ip $now" > "$state" ;;
                *) echo "$now $reg_ip $ok_at" > "$state" ;;
              esac
            fi
            printf '%s %s %s %s\n' "$now" "$ip" "$code" "$(echo "$resp" | sed -n 's/.*"msg":"\([^"]*\)".*/\1/p' | tr ' ' _)" >> "$dir/history"
            tail -n 3 "$dir/history" > "$dir/history.tmp" && mv "$dir/history.tmp" "$dir/history"
            sleep 60
          done
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "32Mi"
            cpu: "50m"

      volumes:
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      - name: gluetun-control-auth
        configMap:
          name: gluetun-control-auth
      - name: config
        persistentVolumeClaim:
          claimName: qbittorrent-vpn-config-iscsi
      - name: media
        persistentVolumeClaim:
          claimName: media-standard
