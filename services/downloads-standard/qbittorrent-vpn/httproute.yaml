apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent-vpn
  namespace: downloads-standard
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: qbittorrent-vpn
      sectionName: https
  hostnames:
    - qbittorrent.labmatt.com
  rules:
    - backendRefs:
        - name: qbittorrent-vpn
          port: 8080
