apiVersion: v1
kind: Secret
metadata:
  name: mam-dynamic-seedbox
  namespace: downloads-standard
# Dedicated MyAnonaMouse session (mam_id), created via MAM Security page with
# "Allow Session to set Dynamic Seedbox" = Yes and ASN-locked to AirVPN's exit
# ASN. Used by the mam-dynamic-seedbox CronJob to re-authorize qBittorrent's
# current VPN exit IP with MAM's tracker after AirVPN reconnects on a new IP.
# Kept separate from any browser login session so logging into MAM elsewhere
# doesn't invalidate it.
data: {}
