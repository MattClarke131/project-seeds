components:
  - ../../infrastructure/kubernetes/storage/shared-volumes/media-standard

patches:
  - target:
      kind: PersistentVolume
      name: media-standard-RENAME-ME
    patch: |-
      - op: replace
        path: /metadata/name
        value: media-standard-downloads

configMapGenerator:
  - name: chaptarr-hardlink-script
    namespace: downloads-standard
    files:
      - hardlink-to-cwa-ingest.sh=chaptarr/hardlink-to-cwa-ingest.sh

generatorOptions:
  disableNameSuffixHash: true
