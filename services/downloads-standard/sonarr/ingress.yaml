apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr-standard
  namespace: downloads-standard
spec:
  ingressClassName: nginx
  rules:
  - host: sonarr.labmatt.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sonarr-standard
            port:
              number: 8989
