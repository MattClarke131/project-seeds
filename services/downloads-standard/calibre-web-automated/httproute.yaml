apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calibre-web-automated
  namespace: downloads-standard
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: calibre-web-automated
      sectionName: https
  hostnames:
    - books.labmatt.com
  rules:
    - backendRefs:
        - name: calibre-web-automated
          port: 8083
