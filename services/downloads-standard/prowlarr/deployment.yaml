apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr-standard
  namespace: downloads-standard
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: "linuxserver.io s6-overlay base image runs its init as root to chown /config etc. to PUID/PGID before dropping to that user; forcing runAsNonRoot at the k8s level would skip that step entirely"
    ignore-check.kube-linter.io/no-read-only-root-fs: "same s6-overlay init writes outside the mounted volumes during startup"
spec:
  replicas: 1
  # RollingUpdate would briefly run two pods against prowlarr-standard-config
  # at once. nfs-provisioner doesn't enforce ReadWriteOnce exclusivity, so
  # concurrent writers from two nodes can corrupt state on this PVC.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr-standard
  template:
    metadata:
      labels:
        app: prowlarr-standard
    spec:
      containers:
      - name: prowlarr-standard
        image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls157
        ports:
        - containerPort: 9696
          name: http
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/New_York"
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: prowlarr-standard-config
