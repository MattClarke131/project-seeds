apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellystat
  namespace: jellyfin
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: jellystat
      sectionName: https
  hostnames:
    - jellystat.labmatt.com
  rules:
    - backendRefs:
        - name: jellystat
          port: 3000
