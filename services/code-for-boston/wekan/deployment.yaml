apiVersion: apps/v1
kind: Deployment
metadata:
  name: wekan
  namespace: code-for-boston
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wekan
  template:
    metadata:
      labels:
        app: wekan
    spec:
      containers:
        - name: wekan
          image: wekanteam/wekan:v9.99
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MONGO_URL
              value: mongodb://wekan-mongo:27017/wekan
            - name: ROOT_URL
              value: https://wekan.labmatt.com
            - name: PORT
              value: "8080"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
