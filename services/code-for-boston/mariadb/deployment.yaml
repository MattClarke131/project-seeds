# Dedicated MariaDB for Leantime only - the leantime/leantime Docker
# image has no PostgreSQL PHP extension (pdo_pgsql), only pdo_mysql, so
# this doesn't join the shared Postgres cluster pattern used elsewhere.
# Not exposed through an Ingress, reachable only in-cluster via the
# ClusterIP Service below.
#
# MARIADB_ROOT_PASSWORD/MARIADB_PASSWORD come from leantime-mysql-credentials,
# created manually (see services/code-for-boston/README.md) rather than
# committed to git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leantime-mysql
  namespace: code-for-boston
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: leantime-mysql
  template:
    metadata:
      labels:
        app: leantime-mysql
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.8
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: leantime-mysql-credentials
                  key: root-password
            - name: MARIADB_DATABASE
              value: leantime
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: leantime-mysql-credentials
                  key: username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: leantime-mysql-credentials
                  key: password
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: leantime-mysql-data
