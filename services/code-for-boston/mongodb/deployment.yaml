# Dedicated MongoDB for Wekan only - nothing else in this cluster uses
# Mongo, so this doesn't join the shared Postgres cluster pattern used
# elsewhere. No auth configured: it's only reachable in-cluster via the
# ClusterIP Service below, never exposed through an Ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wekan-mongo
  namespace: code-for-boston
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wekan-mongo
  template:
    metadata:
      labels:
        app: wekan-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          command: ["mongod", "--storageEngine=wiredTiger"]
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wekan-mongo-data
