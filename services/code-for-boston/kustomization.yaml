# Flux-managed. See clusters/eye-of-michael/flux-system/code-for-boston.yaml
# for the Kustomization CR that reconciles this path. One directory per
# component serving the code-for-boston tenant group (app(s), db, ...).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - mariadb/pvc.yaml
  - mariadb/deployment.yaml
  - mariadb/service.yaml
  - leantime/pvc.yaml
  - leantime/deployment.yaml
  - leantime/service.yaml
  - leantime/ingress.yaml
