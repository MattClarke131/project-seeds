apiVersion: apps/v1
kind: Deployment
metadata:
  name: "13ft"
  namespace: "13ft"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 13ft
  template:
    metadata:
      labels:
        app: 13ft
    spec:
      containers:
        - name: 13ft
          image: ghcr.io/wasi-master/13ft:0.4.1
          ports:
            - containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # Image's USER is a name ("thirteener"), not a numeric UID, so
            # kubelet can't verify runAsNonRoot without an explicit UID -
            # matches the Dockerfile's default ARG UID=1000.
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
