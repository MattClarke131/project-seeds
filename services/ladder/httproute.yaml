apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ladder
  namespace: ladder
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: ladder
      sectionName: https
  hostnames:
    - ladder.labmatt.com
  rules:
    - backendRefs:
        - name: ladder
          port: 8080
