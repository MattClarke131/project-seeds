apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: ladder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
          env:
            - name: LOG_LEVEL
              value: info
          ports:
            - containerPort: 8191
          securityContext:
            allowPrivilegeEscalation: false
            # undetected-chromedriver patches its own chromedriver binary in
            # place under /app at startup, so the rootfs can't be read-only.
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            # Image's USER is a name ("flaresolverr"), not a numeric UID, so
            # kubelet can't verify runAsNonRoot without one. Confirmed 1000
            # by running `id` in the image.
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /config
            # Chromium's default container /dev/shm (64Mi) is too small and
            # crashes the renderer under real page loads - give it real room.
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: config
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
